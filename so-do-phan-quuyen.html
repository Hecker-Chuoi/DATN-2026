<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sơ Đồ Quy Trình Phân Quyền (Authorization Flowchart)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      
      --t1-border: #ef4444;
      --t1-bg: rgba(239, 68, 68, 0.04);
      
      --t2-border: #3b82f6;
      --t2-bg: rgba(59, 130, 246, 0.04);

      --node-bg: #1e293b;
      --node-stroke: #475569;
      
      --diamond-bg: #1e293b;
      --diamond-stroke: #f59e0b;

      --success-bg: rgba(16, 185, 129, 0.12);
      --success-stroke: #10b981;
      --success-text: #34d399;

      --error-bg: rgba(239, 68, 68, 0.12);
      --error-stroke: #ef4444;
      --error-text: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #334155;
      color: #ffffff;
      border-color: #475569;
    }

    .diagram-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 1050px;
      overflow-x: auto;
      display: flex;
      justify-content: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-width: 980px;
    }

    /* SVG Text Styling */
    .text-title {
      font-weight: 600;
      font-size: 14px;
      fill: #f1f5f9;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .text-node {
      font-weight: 500;
      font-size: 13.5px;
      fill: #e2e8f0;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .text-diamond {
      font-weight: 600;
      font-size: 13px;
      fill: #fbbf24;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .text-success {
      font-weight: 600;
      font-size: 14px;
      fill: var(--success-text);
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .text-error {
      font-weight: 600;
      font-size: 14px;
      fill: var(--error-text);
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .text-label-yes {
      font-weight: 700;
      font-size: 12px;
      fill: #34d399;
      text-anchor: middle;
    }

    .text-label-no {
      font-weight: 700;
      font-size: 12px;
      fill: #f87171;
      text-anchor: middle;
    }

    .zone-title {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .zone-t1 {
      fill: #ef4444;
    }

    .zone-t2 {
      fill: #3b82f6;
    }
  </style>
</head>
<body>

  <header>
    <h1>Sơ Đồ Quy Trình Phân Quyền (DATN-2026)</h1>
    <p>Kiểm tra quyền truy cập 2 tầng: RBAC Check & Resource Scope Check</p>
  </header>

  <div class="controls">
    <button class="btn" onclick="window.print()">🖨️ In / Xuất PDF</button>
  </div>

  <div class="diagram-card">
    <svg viewBox="0 0 960 1120" xmlns="http://www.w3.org/2000/svg">
      
      <!-- Defs for Markers and Gradients -->
      <defs>
        <!-- Arrowhead Normal -->
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
        </marker>

        <!-- Arrowhead Green (YES) -->
        <marker id="arrow-yes" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
        </marker>

        <!-- Arrowhead Red (NO) -->
        <marker id="arrow-no" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
        </marker>

        <!-- Node Shadows -->
        <filter id="glow-success" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.25"/>
        </filter>
        <filter id="glow-error" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.25"/>
        </filter>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
      </defs>

      <!-- ==================== CONTAINER ZONES ==================== -->
      
      <!-- TẦNG 1: RBAC CHECK (Red Dotted Box) -->
      <rect x="180" y="110" width="600" height="280" rx="16" 
            fill="rgba(239, 68, 68, 0.03)" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 6" />
      <rect x="200" y="100" width="160" height="24" rx="6" fill="#1e1b4b" stroke="#ef4444" stroke-width="1"/>
      <text x="280" y="116" class="zone-title zone-t1" text-anchor="middle" dominant-baseline="middle">Tầng 1: RBAC Check</text>

      <!-- TẦNG 2: RESOURCE SCOPE CHECK (Blue Dotted Box) -->
      <rect x="180" y="430" width="600" height="420" rx="16" 
            fill="rgba(59, 130, 246, 0.03)" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 6" />
      <rect x="200" y="420" width="220" height="24" rx="6" fill="#172554" stroke="#3b82f6" stroke-width="1"/>
      <text x="310" y="436" class="zone-title zone-t2" text-anchor="middle" dominant-baseline="middle">Tầng 2: Resource Scope Check</text>


      <!-- ==================== FLOW PATHS / LINES ==================== -->

      <!-- 1. Frontend -> Tầng 1: RBAC check -->
      <path d="M 480 65 L 480 145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

      <!-- 2. Tầng 1: RBAC check -> là ADMIN -->
      <path d="M 480 205 L 480 250" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

      <!-- 3. là ADMIN (YES) -> ACTIVE? -->
      <path d="M 550 290 L 630 290" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-yes)" />
      <text x="590" y="280" class="text-label-yes">YES</text>

      <!-- 4. là ADMIN (NO) -> Curved path to Success (Cho phép thực hiện chức năng) -->
      <!-- Runs down the left exterior -->
      <path d="M 410 290 L 100 290 L 100 970 L 195 970" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
      <text x="375" y="280" class="text-label-no">NO</text>

      <!-- 5. ACTIVE? (YES) -> Tầng 2: Resource Scope Check -->
      <path d="M 700 330 L 700 400 L 480 400 L 480 465" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-yes)" />
      <text x="715" y="360" class="text-label-yes">YES</text>

      <!-- 6. ACTIVE? (NO) -> trả lỗi 403 -->
      <!-- Runs down the right exterior -->
      <path d="M 770 290 L 860 290 L 860 970 L 775 970" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-no)" />
      <text x="800" y="280" class="text-label-no">NO</text>

      <!-- 7. Tầng 2: Resource Scope Check -> Thuộc team của dự án không? -->
      <path d="M 480 525 L 480 570" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

      <!-- 8. Thuộc team của dự án không? (YES) -> Kiểm tra vai trò trong team/project -->
      <path d="M 360 620 L 290 620 L 290 735" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-yes)" />
      <text x="330" y="610" class="text-label-yes">YES</text>

      <!-- 9. Thuộc team của dự án không? (NO) -> trả lỗi 403 -->
      <path d="M 480 670 L 480 940 L 655 940" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-no)" />
      <text x="495" y="695" class="text-label-no">NO</text>

      <!-- 10. Kiểm tra vai trò -> Cho phép thực hiện chức năng -->
      <path d="M 290 805 L 290 940" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-yes)" />


      <!-- ==================== NODES & SHAPES ==================== -->

      <!-- Start Node: Frontend -->
      <g filter="url(#shadow)">
        <ellipse cx="480" cy="40" rx="65" ry="25" fill="#334155" stroke="#64748b" stroke-width="2" />
        <text x="480" y="40" class="text-title">frontend</text>
      </g>

      <!-- Process Node 1: Tầng 1: RBAC check -->
      <g filter="url(#shadow)">
        <rect x="360" y="150" width="240" height="55" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2" />
        <text x="480" y="177" class="text-node">Tầng 1: RBAC check</text>
      </g>

      <!-- Decision 1: là ADMIN -->
      <g filter="url(#shadow)">
        <polygon points="480,250 550,290 480,330 410,290" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
        <text x="480" y="290" class="text-diamond">là ADMIN</text>
      </g>

      <!-- Decision 2: ACTIVE? -->
      <g filter="url(#shadow)">
        <polygon points="700,250 770,290 700,330 630,290" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
        <text x="700" y="290" class="text-diamond">ACTIVE?</text>
      </g>

      <!-- Process Node 2: Tầng 2: Resource Scope Check -->
      <g filter="url(#shadow)">
        <rect x="345" y="470" width="270" height="55" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2" />
        <text x="480" y="497" class="text-node">Tầng 2: Resource Scope Check</text>
      </g>

      <!-- Decision 3: Thuộc team của dự án không? -->
      <g filter="url(#shadow)">
        <polygon points="480,570 600,620 480,670 360,620" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
        <text x="480" y="620" class="text-diamond">Thuộc team của dự án không?</text>
      </g>

      <!-- Process Node 3: Kiểm tra vai trò trong team/project -->
      <g filter="url(#shadow)">
        <rect x="150" y="740" width="280" height="65" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2" />
        <text x="290" y="763" class="text-node">Kiểm tra vai trò trong</text>
        <text x="290" y="783" class="text-node" fill="#94a3b8" font-size="12px">team/project (role_in_team)</text>
      </g>

      <!-- End Node Success: Cho phép thực hiện chức năng / hành động -->
      <g filter="url(#glow-success)">
        <rect x="190" y="940" width="270" height="60" rx="16" fill="var(--success-bg)" stroke="var(--success-stroke)" stroke-width="2" />
        <text x="325" y="962" class="text-success">Cho phép thực hiện</text>
        <text x="325" y="980" class="text-success">chức năng / hành động</text>
      </g>

      <!-- End Node Error: trả lỗi 403 -->
      <g filter="url(#glow-error)">
        <rect x="635" y="940" width="140" height="60" rx="16" fill="var(--error-bg)" stroke="var(--error-stroke)" stroke-width="2" />
        <text x="705" y="970" class="text-error">trả lỗi 403</text>
      </g>

    </svg>
  </div>

</body>
</html>
