services:

  # ─────────────────────────────────────────────
  # 1. Identity Service (Spring Boot 8082)
  # ─────────────────────────────────────────────
  identity-service:
    build:
      context: ../backend
      dockerfile: identity-service/Dockerfile
    container_name: identity-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-db:5432/datn_main_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123456"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://keycloak:8080/realms/datn-realm/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: http://localhost:8088/realms/datn-realm
      KEYCLOAK_SERVER-URL: http://keycloak:8080
      KEYCLOAK_PUBLIC-URL: http://localhost:8088
      KEYCLOAK_REALM: datn-realm
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN_CLIENT-ID: admin-cli
      KEYCLOAK_ADMIN_REALM: master
      KEYCLOAK_CLIENT_CLIENT-ID: datn-backend
      KEYCLOAK_CLIENT_CLIENT-SECRET: pBchukVams8pHwBHnPvzTY86e3ou2Ym7
      APP_SERVICES_NOTIFICATION_URL: http://notification-service:9994
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
    extra_hosts:
      - "localhost:host-gateway"
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # 2. API Gateway (Spring Cloud Gateway 8081)
  # ─────────────────────────────────────────────
  api-gateway:
    build:
      context: ../backend
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: identity-service
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://identity-service:8082
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/identity/**
      SPRING_CLOUD_GATEWAY_ROUTES_0_FILTERS_0: StripPrefix=1
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://keycloak:8080/realms/datn-realm/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: http://localhost:8088/realms/datn-realm
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      identity-service:
        condition: service_started
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # 3. Frontend App (React + Nginx 3000)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # Notification Service (Spring Boot 9994) – gửi email qua SMTP, chỉ nội bộ (không qua gateway).
  # ponytail: /internal/** không có auth, chỉ bind loopback; thêm shared-secret header khi deploy ra ngoài docker network.
  # ─────────────────────────────────────────────
  notification-service:
    build:
      context: ../backend
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:9994:9994"
    environment:
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@datn.local}
    networks:
      - app-net

networks:
  app-net:
    name: app-net
    external: true
