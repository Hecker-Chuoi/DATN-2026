# ============================================================================
# docker-compose.tuananh.yml – cấu hình CÁ NHÂN (cổng 999x, MinIO bitnamilegacy, Mailpit, notification-service)
# Dùng: docker compose -f docker-compose.tuananh.yml up -d                 # chỉ hạ tầng (DB, Keycloak, Mailpit, Redis, Kafka, MinIO, pgAdmin)
#       docker compose -f docker-compose.tuananh.yml --profile app up -d --build   # thêm identity/gateway/notification trong Docker
# Mặc định các service backend chạy từ IntelliJ với -Dspring.profiles.active=tuananh (notification không cần profile).
# Các file docker-compose.yml / .app.yml / .infra.yml giữ nguyên bản gốc của nhóm (cổng 808x).
# ============================================================================
# Giữ project name cũ (stack từng chạy từ backend/environment) để tái dùng container + volume dữ liệu environment_*
name: environment

services:

  # ─────────────────────────────────────────────
  # 1. PostgreSQL for Keycloak
  # ─────────────────────────────────────────────
  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: kc_user
      POSTGRES_PASSWORD: kc_password
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kc_user -d keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # 2. Keycloak Service
  # ─────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    restart: unless-stopped
    environment:
      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: kc_user
      KC_DB_PASSWORD: kc_password
      # Admin credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Hostname
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 9998
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
    command: start-dev
    ports:
      - "9998:8080" 
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # 3. PostgreSQL for Backend (datn_main_db)
  # ─────────────────────────────────────────────
  app-db:
    image: postgres:15-alpine
    container_name: app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: datn_main_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d datn_main_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # 4. Identity Service (Spring Boot 9992)
  # ─────────────────────────────────────────────
  identity-service:
    build:
      context: ../backend
      dockerfile: identity-service/Dockerfile
    container_name: identity-service
    profiles: ["app"]   # chỉ chạy khi: docker compose --profile app ...; mặc định chạy từ IntelliJ
    restart: unless-stopped
    ports:
      - "9992:9992"
    environment:
      SPRING_PROFILES_ACTIVE: tuananh
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-db:5432/datn_main_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123456"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://keycloak:8080/realms/datn-realm/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: http://localhost:9998/realms/datn-realm
      KEYCLOAK_SERVER-URL: http://keycloak:8080
      KEYCLOAK_PUBLIC-URL: http://localhost:9998
      KEYCLOAK_REALM: datn-realm
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN_CLIENT-ID: admin-cli
      KEYCLOAK_ADMIN_REALM: master
      KEYCLOAK_CLIENT_CLIENT-ID: datn-backend
      KEYCLOAK_CLIENT_CLIENT-SECRET: pBchukVams8pHwBHnPvzTY86e3ou2Ym7
      APP_SERVICES_NOTIFICATION_URL: http://notification-service:9994
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      app-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # AI Service (Spring Boot 9995) – trợ lý AI; cần GEMINI_API_KEY và AI_TOOLS_API_KEY trong .env (không commit)
  # ─────────────────────────────────────────────
  ai-service:
    build:
      context: ../backend
      dockerfile: ai-service/Dockerfile
    container_name: ai-service
    profiles: ["app"]   # chỉ chạy khi: docker compose --profile app ...; mặc định chạy từ IntelliJ
    restart: unless-stopped
    ports:
      - "9995:9995"
    environment:
      SPRING_PROFILES_ACTIVE: tuananh
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-db:5432/datn_main_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123456"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://keycloak:8080/realms/datn-realm/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: http://localhost:9998/realms/datn-realm
      # work-service mặc định chạy từ IntelliJ trên máy host (9993)
      AI_AGENT_WORK-SERVICE-URL: http://host.docker.internal:9993
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_TOOLS_API_KEY: ${AI_TOOLS_API_KEY:-}
    extra_hosts:
      - "localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    depends_on:
      app-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # ─────────────────────────────────────────────
  # Notification Service (Spring Boot 9994) – gửi email qua SMTP, chỉ nội bộ (không qua gateway)
  # ─────────────────────────────────────────────
  notification-service:
    build:
      context: ../backend
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    profiles: ["app"]   # chỉ chạy khi: docker compose --profile app ...; mặc định chạy từ IntelliJ
    restart: unless-stopped
    ports:
      - "127.0.0.1:9994:9994"
    environment:
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@datn.local}
      # Thông báo trong ứng dụng (docs/services/notification/): bảng notifications, JWT Keycloak, Kafka
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-db:5432/datn_main_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123456"
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/datn-realm/protocol/openid-connect/certs
      KEYCLOAK_ISSUER_URI: http://localhost:9998/realms/datn-realm
      APP_SERVICES_IDENTITY_URL: http://identity-service:9992
      # Listener nội bộ của Kafka (localhost:9092 chỉ dành cho service chạy trên máy)
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - mailpit
    networks:
      - app-net

  # 5. API Gateway (Spring Cloud Gateway 9991)
  # ─────────────────────────────────────────────
  api-gateway:
    build:
      context: ../backend
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    profiles: ["app"]   # chỉ chạy khi: docker compose --profile app ...; mặc định chạy từ IntelliJ
    restart: unless-stopped
    ports:
      - "9991:9991"
    environment:
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: identity-service
      SPRING_PROFILES_ACTIVE: tuananh
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://identity-service:9992
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/identity/**
      SPRING_CLOUD_GATEWAY_ROUTES_0_FILTERS_0: StripPrefix=1
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://keycloak:8080/realms/datn-realm/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: http://localhost:9998/realms/datn-realm
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # 6. pgAdmin 4 (Database Management Web UI)
  # ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      app-db:
        condition: service_healthy
    networks:
      - app-net
  # ─────────────────────────────────────────────
  # 7. MinIO Object Storage (S3-compatible)
  # ─────────────────────────────────────────────
  minio:
    image: bitnamilegacy/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # MinIO Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # 7.1 MinIO Auto-Init (Bucket & Download Policy)
  # ─────────────────────────────────────────────
  minio-init:
    image: bitnamilegacy/minio-client:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set myminio http://minio:9000 minioadmin minioadminpassword); do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing myminio/work-attachments;
      mc anonymous set download myminio/work-attachments;
      echo 'MinIO work-attachments bucket initialized!';
      exit 0;
      "
    networks:
      - app-net
  # ─────────────────────────────────────────────
  # Mailpit (SMTP giả lập cho dev): SMTP localhost:1025, xem mail tại http://localhost:8025
  # ─────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app-net


  # ─────────────────────────────────────────────
  # Redis + Kafka (dùng bởi work-service)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # 6. Apache Kafka (KRaft Mode - No Zookeeper)
  # ─────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT (localhost:9092): service chạy trên máy (start-dev.ps1, IDE).
      # INTERNAL (kafka:29092): service chạy trong container cùng mạng app-net. Kafka trả cho client đúng địa chỉ
      # "quảng bá" của listener nó gọi vào; chỉ có localhost thì container sẽ gọi nhầm vào chính nó.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Mặc định Kafka ghi vào /tmp/kafka-logs TRONG container: tạo lại container là mất topic và offset
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - app-net


volumes:
  redis_data:
  kafka_data:
  keycloak_data:
  app_db_data:
  minio_data:

networks:
  app-net:
    driver: bridge