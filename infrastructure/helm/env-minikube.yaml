# CẤU HÌNH RIÊNG CỦA MÔI TRƯỜNG MINIKUBE — nơi DUY NHẤT ghi tên miền, giao thức và registry.
# Cả hai chart (datn-platform, datn-app) đọc file này qua `-f` (khoá `global`), nên đổi tên miền chỉ sửa ở đây.
# Không chứa bí mật (mật khẩu nằm ở Secret `app-secrets`, xem docs/cicd/cac_buoc/03).
#
# Sửa nhanh bằng script (chạy ở gốc repo, rồi commit):
#   bash infrastructure/k8s/set-public-host.sh <tên-miền-gốc> <http|https> <tài-khoản-dockerhub>
#   ví dụ: bash infrastructure/k8s/set-public-host.sh 13-250-1-2.sslip.io https dockeruser
global:
  scheme: https                       # https khi Nginx máy chủ đã có chứng chỉ; chỉ dùng http để thử tạm
  appHost: app.example.invalid        # tên miền người dùng mở ứng dụng
  ssoHost: sso.example.invalid        # tên miền Keycloak (đăng nhập / Admin Console)
  registry: docker.io/CHANGE_ME       # nơi Jenkins push image: docker.io/<tài-khoản-dockerhub>
