# Một host cho cả frontend và API (cùng origin nên không cần CORS). TLS kết thúc ở Nginx máy chủ, không ở Ingress.
# pathType Prefix khớp theo TỪNG PHẦN của đường dẫn: /notification KHÔNG nuốt route giao diện /notifications,
# /workspace KHÔNG nuốt /workspaces — hai route đó rơi xuống "/" (frontend).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datn-app
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.global.appHost | quote }}
      http:
        paths:
          {{- range list "/identity" "/work" "/workspace" "/notification" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: {{ (index $.Values.backend "api-gateway").port }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
