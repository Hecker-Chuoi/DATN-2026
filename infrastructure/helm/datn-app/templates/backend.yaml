{{- /* Một template cho 5 service Spring Boot (values.backend): Service + Deployment */ -}}
{{- range $name, $svc := .Values.backend }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
    tier: backend
spec:
  replicas: {{ $svc.replicas | default 1 }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0               # pod mới Ready rồi mới tắt pod cũ (M5: zero downtime)
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "app.podLabels" $ | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
        tier: backend
      annotations:
        # Đổi cấu hình là hash đổi, nên Deployment tự rolling update (M5)
        checksum/config: {{ $.Files.Get (printf "files/config/%s/application-k8s.yaml" $name) | sha256sum }}
        checksum/env: {{ include (print $.Template.BasePath "/configmap-env.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ $.Values.serviceAccountName }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if or $svc.waitFor $svc.waitForReady }}
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for t in {{ join " " ($svc.waitFor | default list) }}; do
                until nc -z -w 2 "${t%:*}" "${t#*:}"; do echo "chờ $t"; sleep 3; done
              done
              {{- range $svc.waitForReady }}
              until wget -q -T 5 -O /dev/null {{ . | quote }}; do echo "chờ {{ . }}"; sleep 3; done
              {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      {{- end }}
      containers:
        - name: app
          image: {{ include "app.image" (dict "root" $ "name" $name) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "optional:file:/config/"
            - name: JAVA_TOOL_OPTIONS
              value: {{ $.Values.javaToolOptions | quote }}
            {{- range $svc.secretEnv }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: {{ . }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: env-config
          startupProbe:                     # tối đa 180 giây để khởi động
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:                        # chờ Endpoints gỡ pod rồi mới tắt (graceful shutdown)
              exec: { command: ["sh", "-c", "sleep 10"] }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config
        - name: tmp
          emptyDir: {}
{{- end }}
