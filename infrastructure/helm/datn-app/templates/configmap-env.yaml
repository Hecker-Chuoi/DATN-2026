# Biến môi trường KHÔNG bí mật dùng chung cho 5 service (envFrom). Mật khẩu / secret nằm ở Secret app-secrets.
# Đổi nội dung → checksum/env trong Deployment đổi → các pod tự được thay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-config
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  APP_PUBLIC_URL: {{ include "app.publicUrl" . | quote }}
  APP_CORS_ALLOWED_ORIGINS: {{ include "app.publicUrl" . | quote }}
  APP_COOKIE_SECURE: {{ include "app.cookieSecure" . | quote }}
  KEYCLOAK_PUBLIC_URL: {{ include "app.ssoUrl" . | quote }}
  # iss của token = URL công khai; khoá để kiểm chữ ký lấy qua DNS nội bộ
  KEYCLOAK_ISSUER_URI: {{ printf "%s/realms/%s" (include "app.ssoUrl" .) .Values.keycloak.realm | quote }}
  KEYCLOAK_JWK_SET_URI: {{ printf "%s/realms/%s/protocol/openid-connect/certs" .Values.keycloak.internalUrl .Values.keycloak.realm | quote }}
  MAIL_HOST: {{ .Values.mail.host | quote }}
  MAIL_PORT: {{ .Values.mail.port | quote }}
  MAIL_SMTP_AUTH: {{ .Values.mail.smtpAuth | quote }}
  MAIL_SMTP_STARTTLS: {{ .Values.mail.starttls | quote }}
  MAIL_FROM: {{ .Values.mail.from | quote }}
