# Giá trị MẶC ĐỊNH (rộng rãi, cho máy lớn hơn). Minikube 2 vCPU / 8 GB ghi đè bằng values-minikube.yaml (R3, R5, R6).
# Tên miền / scheme / registry nằm ở infrastructure/helm/env-minikube.yaml (khoá `global`), truyền thêm bằng -f.
# Jenkins chỉ đổi image.tag:  helm upgrade --install datn-app ... --set image.tag=<git-sha>  (infrastructure/k8s/deploy.sh)

# Giá trị mặc định để `helm lint` chạy được một mình; giá trị thật lấy từ env-minikube.yaml.
global:
  scheme: https
  appHost: app.example.invalid
  ssoHost: sso.example.invalid
  registry: docker.io/CHANGE_ME

image:
  tag: ""                         # BẮT BUỘC: git SHA do CI truyền (--set image.tag=...). Rỗng thì helm báo lỗi.
  pullPolicy: IfNotPresent        # tag là SHA bất biến nên không cần Always

secretName: app-secrets           # tạo tay ở bước 2 (docs/cicd/cac_buoc/03); các key được tham chiếu ở `secretEnv` bên dưới
waitImage: busybox:1.36           # init container chờ phụ thuộc

keycloak:
  realm: datn-realm
  internalUrl: http://keycloak:8080     # lấy khoá JWT qua DNS nội bộ; issuer vẫn là URL công khai (platform đặt KC_HOSTNAME_URL)

mail:                             # mặc định trỏ Mailpit của datn-platform (không đăng nhập). SMTP thật: xem 03 §3
  host: mailpit
  port: "1025"
  smtpAuth: "false"
  starttls: "false"
  from: "DATN-2026 <no-reply@datn.local>"

# JVM: -XX:MaxRAMPercentage tính theo limit memory của container (không phải RAM máy).
javaToolOptions: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:+ExitOnOutOfMemoryError"

# Cách thay pod khi deploy. Mặc định: bật pod mới Ready rồi mới tắt pod cũ (không gián đoạn, cần dư RAM).
rollout:
  maxSurge: 1
  maxUnavailable: 0

# Probe của 5 service Spring Boot (actuator). Spring khởi động chậm: startupProbe cho phép tối đa periodSeconds × failureThreshold giây.
probes:
  startup:  { periodSeconds: 5,  failureThreshold: 36, timeoutSeconds: 5 }     # 180 giây
  readiness: { periodSeconds: 10, failureThreshold: 3,  timeoutSeconds: 5 }
  liveness: { periodSeconds: 20, failureThreshold: 5,  timeoutSeconds: 5 }

ingress:
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"        # upload đính kèm
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"    # STOMP WebSocket /notification/ws
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

# 5 service Spring Boot: một template (templates/backend.yaml) sinh Service + Deployment cho mỗi mục.
#   waitFor      : "host:port" — init container chờ cổng TCP mở
#   waitForReady : URL — init container chờ trả 2xx (readiness của phụ thuộc)
#   secretEnv    : biến môi trường lấy từ Secret `secretName` ({name: tên biến, key: key trong Secret})
# Chuỗi khởi động trên DB trống: identity (tạo bảng users) → work (tạo bảng projects) → workspace (Flyway cần projects).
# Mỗi lần deploy chuỗi này cũng chạy, nên deploy mất vài phút (xem docs/cicd/cac_buoc/04).
backend:
  api-gateway:
    port: 8081
    waitFor: []
    waitForReady: []
    secretEnv: []
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { memory: 640Mi }
  identity-service:
    port: 8082
    waitFor: ["postgres:5432"]
    waitForReady: ["http://keycloak:8080/health/ready"]
    secretEnv:
      - { name: SPRING_DATASOURCE_USERNAME, key: app-db-username }
      - { name: SPRING_DATASOURCE_PASSWORD, key: app-db-password }
      - { name: KEYCLOAK_ADMIN_USERNAME, key: keycloak-admin-username }
      - { name: KEYCLOAK_ADMIN_PASSWORD, key: keycloak-admin-password }
      - { name: KEYCLOAK_CLIENT_SECRET, key: keycloak-client-secret }
    resources:
      requests: { cpu: 200m, memory: 448Mi }
      limits: { memory: 768Mi }
  work-service:
    port: 8083
    waitFor: ["postgres:5432", "redis:6379", "kafka:9092", "minio:9000"]
    waitForReady: ["http://identity-service:8082/actuator/health/readiness"]
    secretEnv:
      - { name: SPRING_DATASOURCE_USERNAME, key: app-db-username }
      - { name: SPRING_DATASOURCE_PASSWORD, key: app-db-password }
      - { name: MINIO_ACCESS_KEY, key: minio-root-user }
      - { name: MINIO_SECRET_KEY, key: minio-root-password }
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { memory: 1Gi }
  workspace-service:
    port: 8087
    waitFor: ["postgres:5432", "redis:6379"]
    # Thứ tự migration trên DB trống: Flyway của workspace-service cần bảng projects do work-service tạo
    waitForReady: ["http://work-service:8083/actuator/health/readiness"]
    secretEnv:
      - { name: SPRING_DATASOURCE_USERNAME, key: app-db-username }
      - { name: SPRING_DATASOURCE_PASSWORD, key: app-db-password }
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { memory: 640Mi }
  notification-service:
    port: 9994
    waitFor: ["postgres:5432", "kafka:9092", "redis:6379"]
    waitForReady: []
    secretEnv:
      - { name: SPRING_DATASOURCE_USERNAME, key: app-db-username }
      - { name: SPRING_DATASOURCE_PASSWORD, key: app-db-password }
      - { name: MAIL_USERNAME, key: mail-username }
      - { name: MAIL_PASSWORD, key: mail-password }
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { memory: 640Mi }

frontend:
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }
