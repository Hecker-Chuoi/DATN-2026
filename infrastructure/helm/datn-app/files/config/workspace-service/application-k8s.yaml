# Profile "k8s": nạp đè lên application.yaml trong image. ${...} lấy từ ConfigMap env-config.
# Tài khoản DB (SPRING_DATASOURCE_*) do biến môi trường cung cấp (Secret app-secrets).
server:
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://postgres:5432/datn_main_db
    hikari:
      maximum-pool-size: 5       # R3
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  data:
    redis:
      host: redis
      port: 6379
app:
  frontend-url: ${APP_PUBLIC_URL}
  services:
    identity:
      url: http://identity-service:8082
    notification:
      url: http://notification-service:9994
management:
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    com.datn.workspaceservice: INFO
    org.hibernate.SQL: WARN
