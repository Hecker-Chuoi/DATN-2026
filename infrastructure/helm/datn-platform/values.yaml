# Giá trị MẶC ĐỊNH (rộng rãi). Môi trường Minikube 2 vCPU / 8 GB ghi đè bằng values-minikube.yaml (R2–R4).
# Tên miền / scheme / registry nằm ở infrastructure/helm/env-minikube.yaml (khoá `global`), truyền thêm bằng -f.
#
# Quản trị viên cài chart này MỘT LẦN (driver Secret mặc định của Helm). Jenkins KHÔNG có quyền với release này,
# nên pipeline không thể lỡ tay xoá DB. Cách cài: docs/cicd/cac_buoc/04_VIET_HELM_CHART_VA_SCRIPT.md.

# Giá trị mặc định để `helm lint` chạy được một mình; giá trị thật lấy từ env-minikube.yaml.
global:
  scheme: https
  appHost: app.example.invalid
  ssoHost: sso.example.invalid
  registry: docker.io/CHANGE_ME

secretName: app-secrets          # tạo tay ở bước 2 (docs/cicd/cac_buoc/03), chart chỉ tham chiếu từng key
ingressClassName: nginx
waitImage: busybox:1.36          # init container chờ cổng TCP của phụ thuộc

# ── Postgres: MỘT instance, hai database (R2) ──────────────────────────────
# Script khởi tạo chỉ chạy khi thư mục dữ liệu còn TRỐNG (lần đầu). Đổi mật khẩu về sau phải ALTER USER (03 §8).
postgres:
  image: postgres:15-alpine
  storage: 5Gi                   # volumeClaimTemplates không sửa được sau khi tạo
  appDatabase: datn_main_db      # owner = user ở key app-db-username   (identity, work, workspace, notification)
  keycloakDatabase: keycloak     # owner = user ở key keycloak-db-username
  config:                        # truyền cho postgres bằng -c
    shared_buffers: 128MB
    max_connections: "100"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

keycloak:
  image: quay.io/keycloak/keycloak:24.0.1        # cùng bản docker-compose của nhóm
  importRealm: true                              # false = không mount realm (tự import bằng tay); true thì Secret realmSecret phải có sẵn
  realmSecret: keycloak-realm                    # tạo bằng infrastructure/k8s/make-realm-secret.sh, key realm.json
  adminAllowCidrs: ""                            # giới hạn IP cho /admin (Admin Console); rỗng = chỉ bảo vệ bằng mật khẩu
  # kc.sh mặc định dùng 70% RAM cho heap; cộng metaspace và bộ nhớ native thì bước tự build lúc `start` bị OOMKilled
  # ở limit 1Gi (đã gặp khi chạy thử, xem 02 nghiên cứu §8.9). Đã đo (Keycloak 24.0.1, 25 lượt đổi token + đăng nhập):
  #   MaxRAMPercentage=50 → 1,06 GiB (85% của limit 1280Mi, ParallelGC phình young generation tới ~570 MB)
  #   MaxRAMPercentage=40 → 0,76 GiB (60%), cùng tải. 40% của 1280Mi = 512Mi heap (bằng -Xmx mặc định của Keycloak).
  # KHÔNG thêm -XX:+UseSerialGC ở đây: kc.sh đã tự chọn ParallelGC, hai cờ cùng lúc làm JVM không khởi động được.
  heapOpts: "-XX:MaxRAMPercentage=40 -XX:InitialRAMPercentage=20 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20"
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { memory: 1280Mi }

kafka:
  image: apache/kafka:3.8.0
  heapOpts: "-Xms256m -Xmx512m"
  retentionHours: 168
  storage: 5Gi
  resources:
    requests: { cpu: 200m, memory: 768Mi }
    limits: { memory: 1Gi }

redis:
  image: redis:7-alpine
  maxMemory: 128mb               # đầy thì xoá khoá cũ nhất (allkeys-lru); chỉ chứa cache và khoá job
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }

minio:
  # minio/minio đã bị gỡ khỏi Docker Hub. Chainguard bản miễn phí chỉ có tag latest (entrypoint /usr/bin/minio, uid 65532).
  image: cgr.dev/chainguard/minio:latest
  storage: 10Gi
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }

# Hộp thư giả: notification-service gửi SMTP tới mailpit:1025. KHÔNG có Ingress (đọc thư của người dùng = chiếm được tài khoản),
# xem bằng: kubectl -n datn port-forward svc/mailpit 8025:8025 (qua đường hầm SSH, 03/04). Dùng SMTP thật thì đặt enabled: false.
mailpit:
  enabled: true
  image: axllent/mailpit:v1.34.0
  maxMessages: 200               # tự xoá thư cũ, đỡ tốn RAM
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
