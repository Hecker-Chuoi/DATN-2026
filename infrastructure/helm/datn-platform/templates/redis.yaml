apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        {{- include "platform.podLabels" . | nindent 8 }}
        app.kubernetes.io/name: redis
    spec:
      {{- include "platform.podDefaults" . | nindent 6 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["redis-server", "--save", "", "--appendonly", "no"]   # chỉ cache và khoá, không cần lưu đĩa
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 6379 }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
