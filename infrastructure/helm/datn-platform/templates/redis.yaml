apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        {{- include "platform.podLabels" . | nindent 8 }}
        app.kubernetes.io/name: redis
    spec:
      {{- include "platform.podDefaults" . | nindent 6 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # Chỉ chứa cache và khoá job: không lưu đĩa; R4 giới hạn bộ nhớ, đầy thì xoá khoá cũ nhất
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - {{ .Values.redis.maxMemory | quote }}
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 6379 }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
