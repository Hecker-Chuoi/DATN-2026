# Profile "prod" (docker compose): nạp đè lên application.yml trong image (SPRING_PROFILES_ACTIVE=prod, file mount ở /config).
# ${...} lấy từ biến môi trường do docker-compose.prod.yml đặt (x-spring-env, nguồn: prod/public.env + secrets.env).
server:
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    gateway:
      # Danh sách (list) trong profile THAY THẾ toàn bộ list gốc, nên phải khai ĐỦ 4 route (docs/cicd/02, bẫy 2).
      # Giống application-tuananh.yml, chỉ đổi localhost:<cổng> thành tên service trong docker compose.
      routes:
        - id: identity-service
          uri: http://identity-service:8082
          predicates:
            - Path=/identity/api/**,/identity/actuator/**
          filters:
            - StripPrefix=1
        - id: work-service
          uri: http://work-service:8083
          predicates:
            - Path=/work/api/**,/work/actuator/**,/work/ws-work/**
          filters:
            - StripPrefix=1
        # CỐ Ý không route /workspace/internal/** (nhóm internal không xác thực, chỉ service-to-service)
        - id: workspace-service
          uri: http://workspace-service:8087
          predicates:
            - Path=/workspace/api/**,/workspace/actuator/**
          filters:
            - StripPrefix=1
        # CỐ Ý không route /notification/internal/** (gửi email nội bộ, không xác thực)
        - id: notification-service
          uri: http://notification-service:9994
          predicates:
            - Path=/notification/api/**,/notification/ws/**
          filters:
            - StripPrefix=1
      # CorsWebFilter (app.cors.*) VÀ globalcors đều đang chạy; list gốc chỉ có localhost nên phải đè cả hai,
      # nếu không request ghi / WebSocket từ https://app.<domain> bị 403 khi gateway không thấy header X-Forwarded-*.
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - ${APP_CORS_ALLOWED_ORIGINS}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Lấy khoá qua DNS nội bộ; claim iss của token là URL công khai (KC_HOSTNAME_URL của Keycloak)
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
management:
  endpoint:
    health:
      probes:
        enabled: true      # /actuator/health/liveness và /readiness cho healthcheck của docker compose
logging:
  level:
    com.datn.api_gateway: INFO
