# Profile "prod" (docker compose): nạp đè lên application.yaml trong image. ${...} lấy từ biến môi trường của docker-compose.prod.yml.
# Tài khoản DB (SPRING_DATASOURCE_USERNAME / _PASSWORD) do biến môi trường ghi đè postgres/123456 của file gốc.
server:
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://postgres:5432/datn_main_db
    hikari:
      maximum-pool-size: 5       # 5 service dùng chung một Postgres, max_connections=100
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
keycloak:
  server-url: http://keycloak:8080        # Admin API / đổi token qua DNS nội bộ
  public-url: ${KEYCLOAK_PUBLIC_URL}      # URL trình duyệt được chuyển tới (đăng nhập Google)
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME}
    password: ${KEYCLOAK_ADMIN_PASSWORD}
  client:
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
app:
  frontend-url: ${APP_PUBLIC_URL}         # link trong email xác thực / đặt lại mật khẩu
  cookie:
    secure: ${APP_COOKIE_SECURE}
  services:
    notification:
      url: http://notification-service:9994
    workspace:
      url: http://workspace-service:8087
management:
  endpoint:
    health:
      probes:
        enabled: true
