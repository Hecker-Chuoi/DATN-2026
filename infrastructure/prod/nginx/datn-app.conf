# Nginx của MÁY CHỦ ỨNG DỤNG: nhận 80/443 từ Internet, chuyển vào container (chỉ nghe 127.0.0.1).
# Cài (docs/cicd/cac_buoc/02 §7):
#   sudo cp datn-app.conf /etc/nginx/sites-available/datn-app   rồi thay __APP_HOST__ / __SSO_HOST__
#   sudo certbot --nginx -d <APP_HOST> -d <SSO_HOST> --redirect  (certbot tự thêm khối 443)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Ứng dụng: container frontend (SPA + proxy /identity /work /workspace /notification -> api-gateway, có WebSocket)
server {
    listen 80;
    server_name __APP_HOST__;
    client_max_body_size 50m;                 # upload đính kèm (container frontend cũng đặt 50m)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;             # WebSocket STOMP /notification/ws
        proxy_send_timeout 3600s;
    }
}

# Keycloak: cookie và header lớn nên tăng bộ đệm
server {
    listen 80;
    server_name __SSO_HOST__;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
