# ═══════════════════════════════════════════════════════════════════════════════════════════════
# DATN-2026 — PRODUCTION trên MỘT máy chủ (docker compose): 6 hạ tầng + 6 service Spring Boot + frontend.
#
# KHÔNG chạy trực tiếp bằng tay trong lúc vận hành: dùng infrastructure/prod/scripts/deploy.sh (GitHub Actions gọi qua SSH),
# script đặt đủ biến DATN_HOME, IMAGE_TAG và hai file env. Chạy tay để thử:
#   export DATN_HOME=$HOME/datn IMAGE_TAG=<git-sha-7-ký-tự>
#   docker compose -p datn --env-file infrastructure/prod/public.env --env-file $DATN_HOME/secrets.env \
#     -f infrastructure/docker-compose.prod.yml config            # kiểm tra, in cấu hình đã thay biến
#
# Khác docker-compose.yml / .infra.yml / .app.yml (bản dev của nhóm, cổng 808x): file này dùng image từ Docker Hub
# (không build), chỉ mở 3 cổng ra 127.0.0.1 cho Nginx của máy chủ, có healthcheck + giới hạn RAM cho máy 2 vCPU / 8 GB.
#
# Biến lấy từ:
#   prod/public.env  (commit)         SCHEME, APP_HOST, SSO_HOST, REGISTRY, COOKIE_SECURE, MAIL_HOST/PORT/...
#   secrets.env      (CHỈ trên server) mật khẩu, xem docs/cicd/cac_buoc/03
#   deploy.sh đặt    IMAGE_TAG (git SHA), DATN_HOME (thư mục dữ liệu trên server: secrets.env, realm.json, releases/)
# ═══════════════════════════════════════════════════════════════════════════════════════════════

name: datn            # cố định để volume (postgres_data, kafka_data...) không đổi tên giữa các lần deploy

# Biến môi trường KHÔNG bí mật dùng chung cho 6 service Spring Boot.
x-spring-env: &spring-env
  SPRING_PROFILES_ACTIVE: prod
  SPRING_CONFIG_ADDITIONAL_LOCATION: "optional:file:/config/"
  # Heap theo % của giới hạn RAM container (mem_limit), không phải RAM máy. 65% (không phải 70%) vì metaspace,
  # code cache, luồng nằm ngoài heap. TieredStopAtLevel=1 (chỉ C1) giảm tải CPU khi 5 JVM khởi động cùng lúc trên 2 vCPU.
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"
  APP_PUBLIC_URL: "${SCHEME}://${APP_HOST}"
  APP_CORS_ALLOWED_ORIGINS: "${SCHEME}://${APP_HOST}"
  APP_COOKIE_SECURE: "${COOKIE_SECURE}"
  KEYCLOAK_PUBLIC_URL: "${SCHEME}://${SSO_HOST}"
  # iss của token = URL công khai (Keycloak đặt KC_HOSTNAME_URL); khoá kiểm chữ ký lấy qua mạng nội bộ
  KEYCLOAK_ISSUER_URI: "${SCHEME}://${SSO_HOST}/realms/datn-realm"
  KEYCLOAK_JWK_SET_URI: "http://keycloak:8080/realms/datn-realm/protocol/openid-connect/certs"
  MAIL_HOST: "${MAIL_HOST}"
  MAIL_PORT: "${MAIL_PORT}"
  MAIL_SMTP_AUTH: "${MAIL_SMTP_AUTH}"
  MAIL_SMTP_STARTTLS: "${MAIL_SMTP_STARTTLS}"
  MAIL_FROM: "${MAIL_FROM}"

# Healthcheck chung của service Spring (actuator readiness). start_period dài vì 5 JVM khởi động cùng lúc trên 2 vCPU.
x-spring-health: &spring-health
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 120s

services:
  # ───────────────────────────── Hạ tầng (có trạng thái) ─────────────────────────────
  # MỘT Postgres, hai database (datn_main_db, keycloak), mỗi DB một user. Script khởi tạo chỉ chạy khi volume còn TRỐNG.
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=100"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?thiếu POSTGRES_PASSWORD trong secrets.env}"
      APP_DB_NAME: datn_main_db
      APP_DB_USER: "${APP_DB_USERNAME:?thiếu APP_DB_USERNAME}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?thiếu APP_DB_PASSWORD}"
      KC_DB_NAME: keycloak
      KC_DB_USER: "${KC_DB_USERNAME:?thiếu KC_DB_USERNAME}"
      KC_DB_PASSWORD: "${KC_DB_PASSWORD:?thiếu KC_DB_PASSWORD}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prod/postgres/10-init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    # -h 127.0.0.1 (TCP): server tạm lúc chạy script khởi tạo chỉ nghe unix socket, không có -h thì báo healthy sớm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    networks: [app-net]

  # Keycloak chạy `start` (không phải start-dev). Lần đầu tự build + import realm: 3–10 phút trên 2 vCPU.
  # --import-realm chỉ import khi realm CHƯA tồn tại: sửa realm.json sau đó không có tác dụng (sửa trong Admin Console).
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    restart: unless-stopped
    command: ["start", "--import-realm"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: "${KC_DB_USERNAME}"
      KC_DB_PASSWORD: "${KC_DB_PASSWORD}"
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN_USERNAME:?thiếu KEYCLOAK_ADMIN_USERNAME}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?thiếu KEYCLOAK_ADMIN_PASSWORD}"
      # URL công khai CỐ ĐỊNH: token lấy qua http://keycloak:8080 (nội bộ) vẫn mang iss = URL công khai
      KC_HOSTNAME_URL: "${SCHEME}://${SSO_HOST}"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"            # TLS kết thúc ở Nginx của máy chủ
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_CACHE: local                    # 1 nút, không bật cụm Infinispan
      # kc.sh mặc định dùng 70% RAM cho heap → bị OOMKilled ở limit ~1 GB. KHÔNG thêm -XX:+UseSerialGC: kc.sh đã chọn
      # ParallelGC, hai cờ cùng lúc làm JVM không khởi động được.
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=40 -XX:InitialRAMPercentage=20 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20"
    volumes:
      # realm.json do deploy.sh sinh từ infrastructure/keycloak/realm-export_08082026.json (đã sửa secret + redirect URI)
      - "${DATN_HOME:?thiếu DATN_HOME}/realm.json:/opt/keycloak/data/import/realm.json:ro"
    ports:
      - "127.0.0.1:8080:8080"            # chỉ Nginx của máy chủ (sso.<domain>) vào được
    # Image Keycloak không có curl/wget: gọi HTTP bằng /dev/tcp của bash
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r status <&3 && case "$$status" in *" 200 "*) exit 0;; *) exit 1;; esac
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 60s
    mem_limit: 1280m
    networks: [app-net]

  # Kafka KRaft 1 nút (broker + controller), listener nội bộ kafka:9092.
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data       # mặc định là /tmp trong container: tạo lại container là mất topic
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9092"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    mem_limit: 768m
    networks: [app-net]

  # Redis chỉ chứa cache và khoá job: không lưu đĩa; đầy thì xoá khoá cũ nhất.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 96m
    networks: [app-net]

  # MinIO lưu file đính kèm (bucket work-attachments do work-service tự tạo). KHÔNG mở cổng ra ngoài:
  # file tải về đi qua API /attachments/{id}/download của work-service.
  minio:
    image: cgr.dev/chainguard/minio:latest      # minio/minio đã bị gỡ khỏi Docker Hub
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?thiếu MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?thiếu MINIO_ROOT_PASSWORD}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks: [app-net]

  # Hộp thư giả: notification-service gửi SMTP tới mailpit:1025. Giao diện chỉ nghe 127.0.0.1 (ai xem được hộp thư là
  # đọc được link đặt lại mật khẩu): xem qua đường hầm SSH  ssh -L 18025:127.0.0.1:8025 ...  rồi mở http://localhost:18025
  # Dùng SMTP thật (Gmail) thì có thể bỏ service này và sửa MAIL_* trong public.env.
  mailpit:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "200"
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 64m
    networks: [app-net]

  # ───────────────────────────── Ứng dụng ─────────────────────────────
  # Chuỗi khởi động trên DB TRỐNG: identity (tạo bảng users) → work (tạo bảng projects) → workspace (Flyway cần projects).
  api-gateway:
    image: "${REGISTRY}/datn-api-gateway:${IMAGE_TAG:?deploy.sh phải đặt IMAGE_TAG}"
    restart: unless-stopped
    environment: *spring-env
    volumes:
      - ./prod/spring/api-gateway/application-prod.yaml:/config/application-prod.yaml:ro
    healthcheck:
      <<: *spring-health
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/actuator/health/readiness"]
    mem_limit: 640m
    networks: [app-net]

  identity-service:
    image: "${REGISTRY}/datn-identity-service:${IMAGE_TAG}"
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_USERNAME: "${APP_DB_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${APP_DB_PASSWORD}"
      KEYCLOAK_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:?thiếu KEYCLOAK_CLIENT_SECRET}"
    volumes:
      - ./prod/spring/identity-service/application-prod.yaml:/config/application-prod.yaml:ro
    healthcheck:
      <<: *spring-health
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/actuator/health/readiness"]
    mem_limit: 640m
    networks: [app-net]

  work-service:
    image: "${REGISTRY}/datn-work-service:${IMAGE_TAG}"
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
      identity-service: { condition: service_healthy }
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_USERNAME: "${APP_DB_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${APP_DB_PASSWORD}"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      # Tích hợp GitHub (work-service, V11–V16). Để trống GITHUB_CLIENT_ID thì tính năng chưa dùng được nhưng service vẫn chạy.
      # Cần một GitHub OAuth App có Authorization callback URL = GITHUB_REDIRECT_URI (docs/cicd/cac_buoc/03 §5b).
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      GITHUB_TOKEN_ENCRYPTION_KEY: "${GITHUB_TOKEN_ENCRYPTION_KEY:-}"   # mã hoá token GitHub lưu trong DB; để trống = lưu KHÔNG mã hoá
      GITHUB_STATE_SECRET: "${GITHUB_STATE_SECRET:-}"
      GITHUB_REDIRECT_URI: "${SCHEME}://${APP_HOST}/integrations/github/callback"
      GITHUB_WEBHOOK_URL: "${SCHEME}://${APP_HOST}/work/api/v1/work/integrations/github/webhook"
      # Khoá nội bộ ai-service -> work-service (/internal/ai-tools/**, gateway không route). BẮT BUỘC: tránh dùng khoá mặc định trong repo.
      AI_TOOLS_API_KEY: "${AI_TOOLS_API_KEY:?thiếu AI_TOOLS_API_KEY trong secrets.env}"
    volumes:
      - ./prod/spring/work-service/application-prod.yaml:/config/application-prod.yaml:ro
    healthcheck:
      <<: *spring-health
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8083/actuator/health/readiness"]
    mem_limit: 768m
    networks: [app-net]

  workspace-service:
    image: "${REGISTRY}/datn-workspace-service:${IMAGE_TAG}"
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      work-service: { condition: service_healthy }     # Flyway của workspace cần bảng projects do work-service tạo
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_USERNAME: "${APP_DB_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${APP_DB_PASSWORD}"
    volumes:
      - ./prod/spring/workspace-service/application-prod.yaml:/config/application-prod.yaml:ro
    healthcheck:
      <<: *spring-health
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8087/actuator/health/readiness"]
    mem_limit: 640m
    networks: [app-net]

  notification-service:
    image: "${REGISTRY}/datn-notification-service:${IMAGE_TAG}"
    restart: unless-stopped
    depends_on:                                         # không khởi động được nếu không phân giải được `kafka`
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_USERNAME: "${APP_DB_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${APP_DB_PASSWORD}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
    volumes:
      - ./prod/spring/notification-service/application-prod.yaml:/config/application-prod.yaml:ro
    healthcheck:
      <<: *spring-health
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9994/actuator/health/readiness"]
    mem_limit: 640m
    networks: [app-net]

  # Trợ lý AI (Claude API): lịch sử hội thoại / bộ nhớ lưu trong datn_main_db (Flyway riêng flyway_ai_schema_history), đếm lượt
  # gọi theo ngày bằng Redis, gọi work-service qua /internal/ai-tools/** bằng AI_TOOLS_API_KEY. Không có ANTHROPIC_API_KEY thì
  # service vẫn chạy, chỉ lượt chat báo lỗi (docs/cicd/cac_buoc/03 mục 5c).
  ai-service:
    image: "${REGISTRY}/datn-ai-service:${IMAGE_TAG}"
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_USERNAME: "${APP_DB_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${APP_DB_PASSWORD}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AI_TOOLS_API_KEY: "${AI_TOOLS_API_KEY:?thiếu AI_TOOLS_API_KEY trong secrets.env}"
    volumes:
      - ./prod/spring/ai-service/application-prod.yaml:/config/application-prod.yaml:ro
    healthcheck:
      <<: *spring-health
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8084/actuator/health/readiness"]
    mem_limit: 640m
    networks: [app-net]

  # Frontend: nginx phục vụ SPA và proxy /identity /work /workspace /notification → api-gateway:8081 (frontend/nginx.conf,
  # có WebSocket). Nginx của máy chủ chỉ cần chuyển mọi thứ của app.<domain> tới cổng này.
  frontend:
    image: "${REGISTRY}/datn-frontend:${IMAGE_TAG}"
    restart: unless-stopped
    depends_on:
      api-gateway: { condition: service_healthy }       # nginx phân giải `api-gateway` lúc khởi động, thiếu là không lên
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 64m
    networks: [app-net]

networks:
  app-net:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  minio_data:
