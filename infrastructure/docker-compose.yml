services:

  # ─────────────────────────────────────────────
  # 1. PostgreSQL for Keycloak
  # ─────────────────────────────────────────────
  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: kc_user
      POSTGRES_PASSWORD: kc_password
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kc_user -d keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # 2. Keycloak Service
  # ─────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    restart: unless-stopped
    environment:
      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: kc_user
      KC_DB_PASSWORD: kc_password
      # Admin credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Hostname
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8088
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
    command: start-dev
    ports:
      - "8088:8080" 
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # 3. PostgreSQL for Backend (datn_main_db)
  # ─────────────────────────────────────────────
  app-db:
    image: postgres:15-alpine
    container_name: app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: datn_main_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d datn_main_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # 4. Identity Service (Spring Boot 8082)
  # ─────────────────────────────────────────────
  identity-service:
    build:
      context: ../backend
      dockerfile: identity-service/Dockerfile
    container_name: identity-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-db:5432/datn_main_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123456"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://keycloak:8080/realms/datn-realm/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: http://localhost:8088/realms/datn-realm
      KEYCLOAK_SERVER-URL: http://keycloak:8080
      KEYCLOAK_PUBLIC-URL: http://localhost:8088
      KEYCLOAK_REALM: datn-realm
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN_CLIENT-ID: admin-cli
      KEYCLOAK_ADMIN_REALM: master
      KEYCLOAK_CLIENT_CLIENT-ID: datn-backend
      KEYCLOAK_CLIENT_CLIENT-SECRET: pBchukVams8pHwBHnPvzTY86e3ou2Ym7
      APP_SERVICES_NOTIFICATION_URL: http://notification-service:9994
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      app-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # 5. API Gateway (Spring Cloud Gateway 8081)
  # ─────────────────────────────────────────────
  api-gateway:
    build:
      context: ../backend
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: identity-service
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://identity-service:8082
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/identity/**
      SPRING_CLOUD_GATEWAY_ROUTES_0_FILTERS_0: StripPrefix=1
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: http://keycloak:8080/realms/datn-realm/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI: http://localhost:8088/realms/datn-realm
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # 6. pgAdmin 4 (Database Management Web UI)
  # ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      app-db:
        condition: service_healthy
    networks:
      - app-net
  # ─────────────────────────────────────────────
  # 7. MinIO Object Storage (S3-compatible)
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # MinIO Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # 7.1 MinIO Auto-Init (Bucket & Download Policy)
  # ─────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpassword); do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing myminio/work-attachments;
      /usr/bin/mc anonymous set download myminio/work-attachments;
      echo 'MinIO work-attachments bucket initialized!';
      exit 0;
      "
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # Notification Service (Spring Boot 9994) – thông báo trong ứng dụng (Kafka → bảng notifications → WebSocket,
  # REST/WebSocket qua gateway /notification/**) và email SMTP; /internal/** (email nội bộ) không qua gateway.
  # ponytail: /internal/** không có auth, chỉ bind loopback; thêm shared-secret header khi deploy ra ngoài docker network.
  # ─────────────────────────────────────────────
  notification-service:
    build:
      context: ../backend
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:9994:9994"
    environment:
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@datn.local}
      # Thông báo trong ứng dụng (docs/services/notification/): bảng notifications, JWT Keycloak, Kafka
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-db:5432/datn_main_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123456"
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/datn-realm/protocol/openid-connect/certs
      KEYCLOAK_ISSUER_URI: http://localhost:8088/realms/datn-realm
      APP_SERVICES_IDENTITY_URL: http://identity-service:8082
      # Listener nội bộ của Kafka (localhost:9092 chỉ dành cho service chạy trên máy)
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - mailpit
      - kafka
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # Apache Kafka (KRaft, không cần Zookeeper): sự kiện thông báo từ work-service / workspace-service (outbox)
  # ─────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT (localhost:9092): service chạy trên máy (start-dev.ps1, IDE).
      # INTERNAL (kafka:29092): service chạy trong container cùng mạng app-net. Kafka trả cho client đúng địa chỉ
      # "quảng bá" của listener nó gọi vào; chỉ có localhost thì container sẽ gọi nhầm vào chính nó.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Mặc định Kafka ghi vào /tmp/kafka-logs TRONG container: tạo lại container là mất topic và offset
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - app-net

  # ─────────────────────────────────────────────
  # Mailpit (SMTP giả lập cho dev): SMTP localhost:1025, xem mail tại http://localhost:8025
  # ─────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app-net

volumes:
  kafka_data:
  keycloak_data:
  app_db_data:
  minio_data:

networks:
  app-net:
    driver: bridge
