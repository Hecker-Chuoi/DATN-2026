# Quyền của Jenkins khi deploy (quyền tối thiểu): ServiceAccount `ci-deployer` CHỈ thao tác được trong namespace `datn`,
# và CHỈ trên các loại tài nguyên mà chart datn-app tạo ra. Quản trị viên áp một lần, KHÔNG nằm trong chart nên
# pipeline không tự sửa được quyền của chính nó:
#   kubectl apply -f infrastructure/k8s/rbac-deployer.yaml
#   bash infrastructure/k8s/make-ci-kubeconfig.sh datn          # dựng kubeconfig riêng cho user deployer
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: datn
automountServiceAccountToken: false
---
# Token dài hạn cho kubeconfig của deployer (Kubernetes >= 1.24 không tự tạo nữa). Controller tự điền khoá `token`.
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: datn
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: datn
rules:
  # Tài nguyên của chart datn-app. Helm cần delete khi gỡ tài nguyên khỏi chart và khi rollback.
  # deploy.sh đặt HELM_DRIVER=configmap: lịch sử release lưu trong ConfigMap nên KHÔNG cần quyền đọc Secret.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # helm --wait, kubectl rollout status và chẩn đoán khi deploy lỗi (xem pod, log, sự kiện)
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "endpoints"]
    verbs: ["get", "list", "watch"]
  # CỐ Ý KHÔNG có: secrets, statefulsets, persistentvolumeclaims, serviceaccounts, roles, rolebindings, pods/exec.
  # => Jenkins không đọc được mật khẩu, không đụng tới Postgres / Kafka / MinIO (datn-platform) và không tự nâng quyền.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: datn
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: datn
