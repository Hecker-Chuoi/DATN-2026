# LimitRange + ResourceQuota cho namespace `datn` (Minikube 2 vCPU / 8 GB). Quản trị viên áp một lần, không nằm trong chart:
#   kubectl apply -f infrastructure/k8s/namespace-limits.yaml
#
# Chart datn-platform / datn-app đều khai báo resources rõ ràng cho từng container, nên LimitRange chỉ là lưới an toàn
# cho pod nào quên khai báo (kubectl run thử...). ResourceQuota là TRẦN: nếu cấu hình vượt ngân sách (docs/cicd/cac_buoc/00,
# "Ngân sách tài nguyên") thì pod bị từ chối NGAY lúc tạo, dễ thấy hơn là chạy xong mới bị OOM.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits           # cùng tên với bản tạo tay ở docs/cicd/cac_buoc/03 §7 => apply sẽ cập nhật, không nhân đôi
  namespace: datn
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 64Mi
        cpu: 50m
      default:
        memory: 256Mi              # chỉ giới hạn memory, KHÔNG giới hạn CPU (R3)
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: datn-quota
  namespace: datn
spec:
  hard:
    # Tổng requests hiện tại ≈ 0,55 CPU / 2,9 Gi (platform + app). Trần còn dư cho pod thử và lúc deploy.
    # requests.cpu tối đa 1: kube-system của Minikube đã chiếm ~0,95 trong 2 CPU của nút, vượt là pod kẹt Pending.
    requests.cpu: "1"
    requests.memory: 4608Mi        # 4,5 Gi
    pods: "25"
    persistentvolumeclaims: "6"
    services.nodeports: "0"        # mọi truy cập từ ngoài phải qua Ingress
    services.loadbalancers: "0"
