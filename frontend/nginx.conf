# Địa chỉ thật người dùng mở trang, chuyển cho gateway (server.forward-headers-strategy: framework).
# Có proxy / CDN làm HTTPS đứng trước (VD: Cloudflare, nginx của máy chủ) thì giữ giá trị nó gửi tới.
map $http_x_forwarded_proto $datn_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map $http_x_forwarded_host $datn_forwarded_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

server {
    listen 80;
    server_name localhost;

    # Upload đính kèm (work-service cho tới 50 MB); mặc định của nginx chỉ 1 MB. Cùng giới hạn với Nginx của máy chủ.
    client_max_body_size 50m;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API Gateway
    location /identity/ {
        proxy_pass http://api-gateway:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $datn_forwarded_proto;
        proxy_set_header X-Forwarded-Host $datn_forwarded_host;
    }

    location /work/ {
        proxy_pass http://api-gateway:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $datn_forwarded_proto;
        proxy_set_header X-Forwarded-Host $datn_forwarded_host;
    }

    location /workspace/ {
        proxy_pass http://api-gateway:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $datn_forwarded_proto;
        proxy_set_header X-Forwarded-Host $datn_forwarded_host;
    }

    # Thông báo: REST + WebSocket STOMP (/notification/ws) cần nâng cấp kết nối
    location /notification/ {
        proxy_pass http://api-gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $datn_forwarded_proto;
        proxy_set_header X-Forwarded-Host $datn_forwarded_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Trợ lý AI (SSE): tắt buffering để sự kiện về ngay, giữ kết nối tới 5 phút
    location /ai/ {
        proxy_pass http://api-gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
