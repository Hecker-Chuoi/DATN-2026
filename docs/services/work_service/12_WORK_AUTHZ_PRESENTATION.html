<script type="text/plain" id="src"># 12. Chức năng Phân quyền – Tài liệu thuyết trình

> Phạm vi: `api-gateway`, `identity-service`, `work-service`, `frontend`. Nội dung đối chiếu trực tiếp với code trên nhánh `feat/author-jira` (09/2026).

---

## 1. Tóm tắt một trang

Hệ thống phân quyền theo mô hình **Jira**: quyền không gắn cố định vào tài khoản mà gắn vào **vai trò trong từng dự án**. Cùng một người có thể là quản trị dự án A nhưng chỉ được xem ở dự án B.

Có **3 lớp** kiểm tra, từ ngoài vào trong:

| Lớp | Câu hỏi được trả lời | Nơi kiểm tra |
|---|---|---|
| 1. Xác thực | Bạn là ai? Token có hợp lệ không? | Keycloak cấp JWT, `api-gateway` xác minh chữ ký, chặn mọi request không có token (trừ `/auth/**`) |
| 2. Vai trò toàn hệ thống | Bạn có phải quản trị viên hệ thống (`ADMIN`) không? | Realm role trong JWT. `ADMIN` bỏ qua toàn bộ kiểm tra dự án, và là người duy nhất vào được cổng `/admin` |
| 3. Vai trò trong dự án | Trong dự án này bạn giữ vai trò gì, vai trò đó có quyền X không? | `work-service`: bảng `role_assignments` + `permission_scheme_entries`, kiểm tra bằng AOP trước khi controller chạy |

Nguyên tắc thiết kế: **từ chối mặc định (fail-closed)**. Không xác định được dự án, không phải thành viên, hoặc dự án đã xóa → từ chối.

### 1.1 Ba nhóm vai trò

| Nhóm | Giá trị | Lưu ở đâu | Ý nghĩa |
|---|---|---|---|
| Global role | `ADMIN`, `USER` | Keycloak realm `datn-realm` | `ADMIN` quản trị toàn hệ thống |
| Team role | `LEADER`, `MEMBER`, `VIEWER` | `team_members` (người tạo team tự động là LEADER) | Quyền trên nhóm: LEADER sửa nhóm, thêm bớt thành viên, tạo dự án, xóa nhóm |
| Project role | `ADMINISTRATOR`, `MEMBER`, `VIEWER` (tạo tự động cho từng dự án) | `project_roles`, `role_assignments` | Quyền trên dự án, quyết định bởi ma trận `permission_scheme_entries` |

### 1.2 16 quyền hạt mịn (`PermissionKey`)

| Nhóm | Quyền | Dùng cho |
|---|---|---|
| Dự án | `PROJECT_ADMIN` | Sửa/xóa/khôi phục dự án, quản lý thành viên, cấu hình workflow, trạng thái, loại công việc |
| | `PROJECT_VIEW` | Xem dự án, board, danh sách công việc, chi tiết, bình luận, lịch sử |
| Công việc | `ISSUE_CREATE` | Tạo công việc, tạo công việc con |
| | `ISSUE_EDIT` | Sửa nội dung, kéo thả thứ tự, tải tệp lên, liên kết công việc |
| | `ISSUE_DELETE` | Xóa công việc |
| | `ISSUE_TRANSITION` | Chuyển trạng thái qua ô "Trạng thái" trong modal công việc (board hiện chưa có kéo thả) |
| | `ISSUE_ASSIGN` | Giao việc cho người **khác** (giao cho chính mình không cần) |
| Sprint/Release | `SPRINT_MANAGE`, `RELEASE_MANAGE` | Đã khai báo, chưa có endpoint nào kiểm tra (sprint chưa triển khai backend) |
| Bình luận | `COMMENT_CREATE` | Viết bình luận |
| | `COMMENT_EDIT_OWN` | Sửa bình luận **của mình** |
| | `COMMENT_DELETE_OWN` | Xóa bình luận **của mình** |
| | `COMMENT_DELETE_ALL` | Xóa bình luận của **bất kỳ ai** |
| Tệp đính kèm | `ATTACHMENT_DELETE_OWN` | Xóa tệp mình tải lên |
| | `ATTACHMENT_DELETE_ALL` | Xóa tệp của bất kỳ ai |

### 1.3 Ma trận mặc định khi tạo dự án (`ProjectServiceImpl`)

| Quyền | ADMINISTRATOR | MEMBER | VIEWER |
|---|:---:|:---:|:---:|
| PROJECT_ADMIN | ✅ | ❌ | ❌ |
| PROJECT_VIEW | ✅ | ✅ | ✅ |
| ISSUE_CREATE | ✅ | ✅ | ❌ |
| ISSUE_EDIT | ✅ | ✅ | ❌ |
| ISSUE_DELETE | ✅ | ❌ | ❌ |
| ISSUE_TRANSITION | ✅ | ✅ | ❌ |
| ISSUE_ASSIGN | ✅ | ✅ | ❌ |
| SPRINT_MANAGE / RELEASE_MANAGE | ✅ | ❌ | ❌ |
| COMMENT_CREATE | ✅ | ✅ | ✅ |
| COMMENT_EDIT_OWN | ✅ | ✅ | ✅ |
| COMMENT_DELETE_OWN | ✅ | ✅ | ✅ |
| COMMENT_DELETE_ALL | ✅ | ❌ | ❌ |
| ATTACHMENT_DELETE_OWN | ✅ | ✅ | ❌ |
| ATTACHMENT_DELETE_ALL | ✅ | ❌ | ❌ |

Khi dự án gắn với một team, `syncTeamMembersToProject()` tự gán: team `LEADER` → `ADMINISTRATOR`, team `VIEWER` → `VIEWER`, còn lại → `MEMBER`.

---

## 2. Các trường hợp phân quyền (kèm ví dụ)

Nhân vật dùng xuyên suốt:

| Tên | Vai trò | Ghi chú |
|---|---|---|
| **An** | Global `ADMIN` | Quản trị hệ thống, không nằm trong dự án nào |
| **Bình** | Project Lead của dự án **BLOG** | Người tạo dự án |
| **Cường** | `MEMBER` của BLOG | Thành viên thường |
| **Dung** | `VIEWER` của BLOG | Chỉ xem, được bình luận |
| **Em** | Tài khoản `USER` bình thường | Không thuộc BLOG |
| **Phúc** | `ADMINISTRATOR` của dự án **SHOP** | Không thuộc BLOG |

### 2.1 Truy cập dự án

| # | Tình huống | Kết quả | Vì sao (code) |
|---|---|---|---|
| A1 | Em mở trang danh sách dự án | Không thấy BLOG | `GET /projects` chỉ trả về dự án mà user có `role_assignments`; `ADMIN` thấy tất cả |
| A2 | Em gõ thẳng URL `/projects/{id BLOG}` | Trang **403 Không có quyền** | `GET /projects/{id}` yêu cầu `PROJECT_VIEW`; `hasPermission` trả `false` vì không có assignment (bước 2) |
| A3 | Phúc (admin của SHOP) mở BLOG | 403 | Vai trò chỉ có hiệu lực trong dự án được gán, không mang sang dự án khác |
| A4 | An mở BLOG dù không là thành viên | Vào được, thấy mọi nút | `ProjectPermissionGuard` kiểm tra `isGlobalAdmin()` trước và cho qua ngay |
| A5 | Dung mở BLOG | Xem được board, danh sách, chi tiết | `PROJECT_VIEW` cấp cho **mọi** thành viên bất kể vai trò (bước 3) |
| A6 | Bình xóa BLOG (soft delete), Cường mở lại | 403 | `hasPermission` trả `false` khi `deletedAt != null` |
| A7 | Bình khôi phục BLOG | Được | `POST /{id}/restore` cần `PROJECT_ADMIN`; Lead luôn có mọi quyền (bước 1) |

### 2.2 Quản lý dự án và thành viên

| # | Tình huống | Kết quả | Vì sao |
|---|---|---|---|
| B1 | Cường sửa tên/mô tả dự án | 403 | `PUT /projects/{id}` cần `PROJECT_ADMIN`, MEMBER không có |
| B2 | Bình mời Em vào BLOG với vai trò MEMBER | Tạo **lời mời** PENDING; Em chỉ thấy BLOG sau khi chấp nhận | `POST /members` cần `PROJECT_ADMIN` và chỉ tạo `Invitation`; `InvitationService.accept` mới ghi `role_assignments` |
| B3 | Cường thêm thành viên | 403, nút "Thêm thành viên" cũng bị ẩn | `ProjectMembersTab` chỉ hiện khi `isAdmin` |
| B4 | Bình đổi Cường thành ADMINISTRATOR, Cường thêm thành viên | Được | ADMINISTRATOR có toàn bộ quyền (bước 4) |
| B5 | Cường (đã là ADMINISTRATOR) hạ Bình xuống VIEWER | Bị chặn | Lead/Creator được tính là admin ngầm định, không xóa/hạ được (`Không thể xóa Project Lead khỏi dự án`) |
| B6 | Dự án chỉ còn 1 ADMINISTRATOR không phải Lead, người đó tự hạ vai trò | Bị chặn | `assertNotLastAdministrator()` bảo đảm luôn còn ít nhất một quản trị |
| B7 | Bình thêm Phúc bằng id lấy từ identity-service | Được, id được quy đổi | `canonicalUserId()` gọi Feign đổi id nội bộ sang Keycloak `sub` trước khi ghi |
| B8 | Cường (team MEMBER) bấm "Tạo dự án" | Nút bị ẩn; Postman `POST /projects` với `teamId` của team → 403; bỏ trống `teamId` → 403 | `createProject` yêu cầu người gọi là **owner hoặc LEADER** của team được chọn (hoặc Global ADMIN); dự án không gắn nhóm chỉ Global ADMIN tạo được. Frontend đọc `myRole` từ `GET /teams/my` để ẩn nút |

### 2.3 Công việc (Issue)

| # | Tình huống | Kết quả | Vì sao |
|---|---|---|---|
| C1 | Dung bấm "Tạo công việc" | Nút bị ẩn; gọi API trực tiếp → 403 | `ISSUE_CREATE` không cấp cho VIEWER; board chỉ hiện nút khi `canCreate` |
| C2 | Cường tạo công việc và tự giao cho mình | Được | `ISSUE_CREATE`; giao cho chính mình không cần `ISSUE_ASSIGN` |
| C3 | Cường tạo công việc giao cho Dung | Được | MEMBER mặc định có `ISSUE_ASSIGN` |
| C4 | Bình bỏ `ISSUE_ASSIGN` khỏi vai trò MEMBER, Cường giao việc cho Dung | 403 | `WorkItemServiceImpl` kiểm tra `ISSUE_ASSIGN` riêng khi `assigneeId` khác người thao tác |
| C5 | Cường mở công việc, chọn ô Trạng thái → "In Progress" | Được, thẻ chuyển cột trên board | `ISSUE_TRANSITION` |
| C6 | Dung mở công việc, bấm ô Trạng thái | Ô bị vô hiệu; Postman → 403 | VIEWER không có `ISSUE_TRANSITION` |
| C7 | Cường xóa công việc | 403 | `ISSUE_DELETE` chỉ ADMINISTRATOR |
| C8 | Bình xóa công việc | Được | Lead |
| C9 | Em gọi `GET /work-items/{id}` của BLOG bằng Postman | 403 | `@RequireTaskPermission` tải work item → lấy `projectId` → kiểm tra `PROJECT_VIEW` |
| C10 | Cường tải tệp lên công việc | Được | Upload cần `ISSUE_EDIT` |
| C11 | Dung tải tệp lên | 403 | VIEWER không có `ISSUE_EDIT` |

### 2.4 Bình luận và tệp đính kèm (quyền theo **sở hữu**)

| # | Tình huống | Kết quả | Vì sao |
|---|---|---|---|
| D1 | Dung viết bình luận | Được | VIEWER có `COMMENT_CREATE` |
| D2 | Dung sửa bình luận của mình | Được | `COMMENT_EDIT_OWN` + là tác giả |
| D3 | Dung sửa bình luận của Cường | 403 "Bạn chỉ có quyền sửa bình luận của chính mình" | Không có quyền sửa bình luận người khác trong hệ thống, kể cả ADMINISTRATOR |
| D4 | Cường xóa bình luận của mình | Được | `COMMENT_DELETE_OWN` + tác giả |
| D5 | Cường xóa bình luận của Dung | 403 | MEMBER không có `COMMENT_DELETE_ALL` |
| D6 | Bình xóa bình luận của Dung | Được | Lead → `COMMENT_DELETE_ALL` |
| D7 | Cường xóa tệp mình tải lên | Được | `ATTACHMENT_DELETE_OWN` |
| D8 | Cường xóa tệp Bình tải lên | 403 | Cần `ATTACHMENT_DELETE_ALL` |
| D9 | Dung xóa tệp của chính mình | 403 | VIEWER không có `ATTACHMENT_DELETE_OWN` (và cũng không tải lên được) |

### 2.5 Cấu hình dự án (workflow, trạng thái, loại công việc)

| # | Tình huống | Kết quả | Vì sao |
|---|---|---|---|
| E1 | Cường mở tab "Cấu hình Dự án" | Xem được, mọi nút thêm/sửa/xóa bị ẩn | GET cần `PROJECT_VIEW`; tab nhận `isAdmin=false` |
| E2 | Cường gọi API tạo trạng thái mới | 403 | `POST /statuses` cần `PROJECT_ADMIN` |
| E3 | Bình tạo loại công việc mới | Được | `PROJECT_ADMIN` |
| E4 | Bình sửa workflow scheme | Được | `PROJECT_ADMIN` |
| E5 | Bình tạo workflow **dùng chung** (không gắn dự án) | 403 | `WorkflowServiceImpl` yêu cầu `assertGlobalAdmin()` khi `projectId` null |
| E6 | An tạo workflow dùng chung | Được | Global ADMIN |

### 2.6 Team

| # | Tình huống | Kết quả | Vì sao |
|---|---|---|---|
| F1 | Em xem team mà mình không thuộc | 403 | `@PreAuthorize("@teamSecurity.isMember(#teamId)")` |
| F2 | Cường (team MEMBER) đổi tên team | 403 | `isLeader` yêu cầu là người tạo team hoặc role `LEADER` |
| F3 | Bình (LEADER) mời Em vào team | Tạo lời mời PENDING; Em vào team khi chấp nhận | `isLeader`; `POST /teams/{id}/members` chỉ tạo `Invitation` |
| F4 | Cường (MEMBER) xóa team | 403 | `DELETE /teams/{id}` cần `isLeader` |
| F5 | Bình (người tạo team, đồng thời là LEADER) xóa team | Được; dự án thuộc team được gỡ `teamId`, thành viên bị xóa khỏi team | `isLeader`; người tạo team không rời nhóm được, chỉ xóa hoặc chuyển quyền |
| F6 | An liệt kê toàn bộ team | Được | `GET /teams` cần `isGlobalAdmin()` |
| F7 | Dự án BLOG gắn team; Em chấp nhận lời mời vào team với role VIEWER | Em tự động thành VIEWER của BLOG | `InvitationService.accept` gọi `syncTeamMemberToProjects()`; khi gắn team vào dự án thì `syncTeamMembersToProject()` |
| F8 | Bình (LEADER của team DEV) tạo dự án gắn team DEV | Được; modal chỉ liệt kê những nhóm Bình là trưởng nhóm | `isTeamLeader()` trong `ProjectServiceImpl`; `leaderTeams` trong `WorkspaceLayout` |

### 2.7 Cổng quản trị `/admin`

| # | Tình huống | Kết quả | Vì sao |
|---|---|---|---|
| G1 | Em đăng nhập tại `/admin/login` | Bị từ chối | Frontend kiểm tra realm role `ADMIN` trong JWT |
| G2 | Em gọi `GET /identity/api/v1/admin/users` | 403 | `@PreAuthorize("hasRole('ADMIN')")` |
| G3 | An đổi role của Em thành ADMIN | Được; Em phải đăng nhập lại mới có hiệu lực | Role nằm trong JWT, token cũ vẫn là USER |

### 2.8 Lời mời tham gia nhóm / dự án (Invitation)

Không ai được "thêm thẳng" người khác vào nhóm hay dự án. Trưởng nhóm / quản trị dự án chỉ **gửi lời mời**; người được mời chấp nhận mới thành thành viên. Bảng `invitations` (`type`, `target_id`, `invitee_user_id`, `invited_by`, `team_role` / `project_role_id`, `status`).

| # | Tình huống | Kết quả | Vì sao |
|---|---|---|---|
| I1 | Cường (MEMBER) gọi `POST /projects/{id}/members` | 403 | Vẫn cần `PROJECT_ADMIN` để gửi lời mời |
| I2 | Bình mời Em lần thứ hai khi lời mời cũ còn PENDING | 400 "Đã có lời mời đang chờ" | Unique index `(type, target_id, invitee)` WHERE status = PENDING |
| I3 | Bình mời Cường (đã là thành viên) | 400 "đã là thành viên" | Kiểm tra `role_assignments` / `team_members` trước khi tạo |
| I4 | Em chấp nhận lời mời | Có `role_assignments` với vai trò trong lời mời; lời mời → ACCEPTED | `InvitationService.accept` chỉ cho `invitee_user_id` |
| I5 | Cường gọi accept lời mời của Em | 403 "không dành cho bạn" | So `invitee_user_id` với `sub` |
| I6 | Em từ chối | Lời mời → DECLINED, không có quyền gì | |
| I7 | Bình hủy lời mời đang chờ | → CANCELLED | Người gửi, trưởng nhóm, `PROJECT_ADMIN` hoặc Global ADMIN |
| I8 | Dung (VIEWER) gọi `GET /invitations?projectId=` | 403 | Chỉ `PROJECT_ADMIN` xem lời mời của dự án; ai cũng xem được `GET /invitations/my` của mình |
| I9 | Chấp nhận lời mời đã ACCEPTED/CANCELLED | 400 "đã được xử lý" | Chỉ PENDING mới xử lý được |

### 2.9 Trường hợp biên (fail-closed)

| # | Tình huống | Kết quả |
|---|---|---|
| H1 | Request không có token | Gateway trả 401 trước khi tới service |
| H2 | Token hết hạn | 401; frontend tự gọi refresh, nếu thất bại xóa token và chuyển tới trang **401** "Phiên đăng nhập đã hết hạn" |
| H3 | Endpoint có annotation nhưng không tìm được `projectId` trong tham số | 403 "Không xác định được dự án để kiểm tra quyền" |
| H4 | `workItemId` không tồn tại | 403 (không tiết lộ có tồn tại hay không) |
| H5 | Frontend chưa tải xong quyền | Mọi `hasPermission` trả `false`, nút bị ẩn cho đến khi tải xong |

## 4. Sơ đồ luồng theo code

### 4.1 Luồng chuẩn: người dùng đổi trạng thái công việc (ô "Trạng thái" trong modal)

```mermaid
sequenceDiagram
    autonumber
    actor U as Cường (MEMBER)
    participant FE as Frontend<br/>ProjectBoardView
    participant GW as api-gateway<br/>SecurityConfig + TokenRelayFilter
    participant CTRL as WorkItemTransitionController
    participant AOP as ProjectPermissionGuard<br/>(@Before aspect)
    participant SVC as ProjectMemberServiceImpl<br/>hasPermission()
    participant DB as PostgreSQL

    U->>FE: chọn Trạng thái To Do → In Progress
    FE->>GW: POST /work/api/v1/work/work-items/{id}/transitions/{tid}<br/>Authorization: Bearer JWT
    GW->>GW: CookieOrBearerTokenConverter lấy token<br/>xác minh chữ ký với JWKS Keycloak
    alt token sai / hết hạn
        GW-->>FE: 401
    end
    GW->>CTRL: StripPrefix → /api/v1/work/work-items/{id}/transitions/{tid}
    Note over CTRL: @RequireTaskPermission(ISSUE_TRANSITION)
    CTRL->>AOP: checkPermission(joinPoint)
    AOP->>AOP: SecurityUtils.getCurrentUserId() = JWT.sub
    AOP->>AOP: SecurityUtils.isGlobalAdmin()?
    alt realm role ADMIN
        AOP-->>CTRL: cho qua
    end
    AOP->>AOP: resolveTaskId() từ @PathVariable("id")
    AOP->>DB: workItemRepository.findById(taskId)
    DB-->>AOP: WorkItem.projectId
    AOP->>SVC: hasPermission(projectId, userId, ISSUE_TRANSITION)
    SVC->>DB: projects.findById → deletedAt?
    SVC->>SVC: userId == leadUserId || createdBy?
    SVC->>DB: role_assignments where project_id & user_id
    SVC->>DB: project_roles.name == ADMINISTRATOR?
    SVC->>DB: permission_scheme_entries exists(project, role, "ISSUE_TRANSITION")
    SVC-->>AOP: true
    AOP-->>CTRL: tiếp tục
    CTRL->>CTRL: workflowEngine.executeTransition(...)
    CTRL-->>FE: 200 WorkItem
    FE-->>U: thẻ nằm ở cột mới
```

Nếu `hasPermission` trả `false`, aspect ném `AccessDeniedException` → `GlobalExceptionHandler` trả **403** kèm thông báo `"Bạn không có quyền thực hiện thao tác này (ISSUE_TRANSITION) trên công việc"`, frontend hiện toast. Với VIEWER, ô Trạng thái đã bị vô hiệu từ trước nên chỉ gặp 403 khi gọi API trực tiếp.

```mermaid

    end

    H-->>P: isAdmin, canCreateIssue, can(key)
    Note over P: forbidden → trang AccessDenied<br/>isAdmin → tab Thành viên hiện nút Thêm/Đổi vai trò/Xóa<br/>canCreateIssue → board hiện nút Tạo công việc<br/>chưa ready → mọi quyền = false
```

Frontend chỉ dùng kết quả này để **ẩn/hiện giao diện**. Backend luôn kiểm tra lại, nên gọi API trực tiếp (Postman) vẫn bị 403.

**Đồng bộ gần thời gian thực** (`WorkItemDetailModal`): khi modal đang mở, cứ 5 giây gọi lại `GET comments`, `GET attachments`, `GET changelogs` của công việc đó (dừng khi tab ẩn, gọi ngay khi tab hiện lại). Mỗi request vẫn đi qua `@RequireTaskPermission(PROJECT_VIEW)`, nên người bị gỡ khỏi dự án sẽ nhận 403 ở lần poll kế tiếp. Đây là giải pháp tối giản; WebSocket STOMP (gateway đã có route `/work/ws-work/**`) là bước nâng cấp khi cần realtime thực sự.

**Trang lỗi** (`components/common/AccessDenied.jsx`, một component cho 3 mã):

| Mã | Khi nào | Cách tới |
|---|---|---|
| 401 | Refresh token thất bại hoặc không có | Interceptor trong `api.js` xóa token rồi `window.location.replace('/401')` (cổng admin → `/admin/login`) |
| 403 | `GET /projects/{id}` hoặc `permissions/my` trả 403 | `ProjectDetailPage` `return <AccessDenied status={403} />` thay toàn bộ nội dung; route `/403` dùng cho trường hợp khác |
| 404 | Dự án không tồn tại, hoặc URL không khớp route nào | `ProjectDetailPage` với 404; route `/404` và catch-all `*` |

2. Đăng nhập `binh`, tạo team **DEV** (binh là trưởng nhóm), rồi tạo dự án **BLOG** (key `BLOG`) gắn team DEV. `binh` tự động là Lead + ADMINISTRATOR. Chỉ trưởng nhóm mới tạo được dự án.

## 6. Điểm nhấn khi thuyết trình

1. **Quyền theo dự án, không theo tài khoản**: cùng một người có thể là ADMINISTRATOR ở dự án này và VIEWER ở dự án khác (case A3, B4).
2. **Ba lớp kiểm tra độc lập**: Gateway (xác thực) → Global role → Project role, lớp sau không tin lớp trước.
3. **Fail-closed**: mọi nhánh không xác định đều từ chối (H1–H5).
4. **Quyền sở hữu tách khỏi quyền vai trò**: `*_OWN` và `*_ALL` cho phép Jira-style "sửa của mình, admin xóa của mọi người" (D1–D9).
5. **Frontend chỉ ẩn/hiện, backend quyết định**: mọi test case đều có thể chứng minh bằng Postman (các TC có "Postman").
6. **Bảo vệ toàn vẹn**: không xóa Lead, không hạ admin cuối cùng (B5, B6, M-06, M-07).
