# =============================================================================
# backend/api-gateway/src/main/resources/application-prod.yml
# Bật bằng biến môi trường SPRING_PROFILES_ACTIVE=prod (compose / k8s đều đã đặt).
#
# VÌ SAO CẦN FILE NÀY?
#   Compose hiện tại khai báo route bằng biến môi trường SPRING_CLOUD_GATEWAY_ROUTES_0_*.
#   Với danh sách (list), Spring Boot KHÔNG gộp từng phần tử mà THAY THẾ CẢ DANH SÁCH
#   → chỉ còn route số 0 (identity) → gateway trong container mất /work và /workspace.
#   Profile file khai báo đủ cả 3 route nên không bị mất.
#
# Tên host (identity-service, work-service, ...) là tên container trong Docker network
# (Hướng 1) và cũng là tên Service trong Kubernetes (Hướng 2) → một file dùng cho cả hai.
# =============================================================================
spring:
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://identity-service:8082}
          predicates:
            - Path=/identity/api/**, /identity/actuator/**
          filters:
            - StripPrefix=1

        - id: work-service
          uri: ${WORK_SERVICE_URL:http://work-service:8083}
          predicates:
            - Path=/work/api/**, /work/actuator/**, /work/ws-work/**
          filters:
            - StripPrefix=1

        - id: workspace-service
          uri: ${WORKSPACE_SERVICE_URL:http://workspace-service:8087}
          predicates:
            - Path=/workspace/api/**, /workspace/actuator/**
          filters:
            - StripPrefix=1

      # Production gọi API cùng tên miền với trang web (same-origin) nên gần như không cần CORS,
      # vẫn khai báo tên miền thật để an toàn khi gọi chéo.
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - ${APP_FRONTEND_URL:https://datn.example.com}

logging:
  level:
    com.datn.api_gateway: INFO
