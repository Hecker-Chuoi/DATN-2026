# PostgreSQL của ứng dụng (datn_main_db) – StatefulSet 1 bản sao + ổ đĩa bền vững (PVC).
# StatefulSet thay vì Deployment: Pod có tên cố định (app-db-0) và luôn gắn lại đúng PVC cũ.
# PVC dùng StorageClass "local-path" có sẵn của k3s → dữ liệu nằm ở /var/lib/rancher/k3s/storage trên EC2.
apiVersion: v1
kind: Service
metadata:
  name: app-db
spec:
  selector:
    app: app-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app-db
spec:
  serviceName: app-db
  replicas: 1
  selector:
    matchLabels:
      app: app-db
  template:
    metadata:
      labels:
        app: app-db
        tier: infra
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: datn_main_db
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: datn-secrets, key: APP_DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: datn-secrets, key: APP_DB_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d datn_main_db"]
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
