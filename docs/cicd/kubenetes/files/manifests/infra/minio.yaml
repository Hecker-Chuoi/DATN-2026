# MinIO (file đính kèm). Image minio/minio đã bị gỡ khỏi Docker Hub → dùng bitnamilegacy/minio.
# Bucket work-attachments do work-service tự tạo khi khởi động; tải file đi qua API work-service
# nên MinIO KHÔNG cần Ingress.
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        tier: infra
    spec:
      enableServiceLinks: false
      containers:
        - name: minio
          image: bitnamilegacy/minio:latest
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: datn-secrets, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: datn-secrets, key: MINIO_ROOT_PASSWORD } }
          volumeMounts:
            - name: data
              mountPath: /bitnami/minio/data
          readinessProbe:
            tcpSocket: { port: 9000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
