# notification-service (:9994) – chỉ gửi email SMTP, chỉ gọi nội bộ (KHÔNG có Ingress)
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 9994
      targetPort: 9994
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        tier: app
    spec:
      enableServiceLinks: false
      containers:
        - name: app
          image: datn/notification-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9994
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
            - name: MAIL_HOST
              valueFrom: { secretKeyRef: { name: datn-secrets, key: MAIL_HOST } }
            - name: MAIL_PORT
              valueFrom: { secretKeyRef: { name: datn-secrets, key: MAIL_PORT } }
            - name: MAIL_USERNAME
              valueFrom: { secretKeyRef: { name: datn-secrets, key: MAIL_USERNAME } }
            - name: MAIL_PASSWORD
              valueFrom: { secretKeyRef: { name: datn-secrets, key: MAIL_PASSWORD } }
            - name: MAIL_SMTP_AUTH
              valueFrom: { secretKeyRef: { name: datn-secrets, key: MAIL_SMTP_AUTH } }
            - name: MAIL_SMTP_STARTTLS
              valueFrom: { secretKeyRef: { name: datn-secrets, key: MAIL_SMTP_STARTTLS } }
            - name: MAIL_FROM
              valueFrom: { secretKeyRef: { name: datn-secrets, key: MAIL_FROM } }
          startupProbe:
            tcpSocket: { port: 9994 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket: { port: 9994 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 9994 }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
