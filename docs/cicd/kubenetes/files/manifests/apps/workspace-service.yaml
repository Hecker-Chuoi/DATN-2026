# workspace-service (:8087) – workspace, thành viên, lời mời workspace
apiVersion: v1
kind: Service
metadata:
  name: workspace-service
spec:
  selector:
    app: workspace-service
  ports:
    - name: http
      port: 8087
      targetPort: 8087
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-service
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: workspace-service
  template:
    metadata:
      labels:
        app: workspace-service
        tier: app
    spec:
      enableServiceLinks: false
      containers:
        - name: app
          image: datn/workspace-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8087
          envFrom:
            - configMapRef: { name: datn-config }
          env:
            - name: APP_DOMAIN
              valueFrom: { secretKeyRef: { name: datn-secrets, key: APP_DOMAIN } }
            - name: AUTH_DOMAIN
              valueFrom: { secretKeyRef: { name: datn-secrets, key: AUTH_DOMAIN } }
            - name: APP_FRONTEND_URL
              value: "https://$(APP_DOMAIN)"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI
              value: "https://$(AUTH_DOMAIN)/realms/datn-realm"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: datn-secrets, key: APP_DB_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: datn-secrets, key: APP_DB_PASSWORD } }
          startupProbe:
            tcpSocket: { port: 8087 }
            periodSeconds: 5
            failureThreshold: 48
          readinessProbe:
            tcpSocket: { port: 8087 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8087 }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
