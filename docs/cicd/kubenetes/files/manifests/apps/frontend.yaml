# frontend (:80) – Nginx phục vụ bundle React (build với nginx.prod.conf: chỉ file tĩnh)
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2                      # rất nhẹ (~10MB RAM) → chạy 2 bản cho dư dả
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: app
    spec:
      enableServiceLinks: false
      containers:
        - name: app
          image: datn/frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { memory: 128Mi }
