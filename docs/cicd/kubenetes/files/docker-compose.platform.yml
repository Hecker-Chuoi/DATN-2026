# =============================================================================
# docker-compose.platform.yml – HƯỚNG 2: Jenkins + Docker Registry chạy NGOÀI k3s
# Đặt trên server tại: /opt/datn/platform/  (cùng jenkins.Dockerfile, .env chứa DOCKER_GID)
#
#   cd /opt/datn/platform && docker compose up -d --build
#
# Vì sao Jenkins không chạy TRONG k3s?
#   - Tránh "con gà – quả trứng": cluster hỏng thì vẫn còn Jenkins để sửa / deploy lại.
#   - Build image cần Docker daemon; trong Pod phải dùng Kaniko/BuildKit → phức tạp hơn nhiều.
#
# Vì sao cần registry?
#   k3s dùng containerd RIÊNG, không nhìn thấy image trong Docker. Jenkins build bằng Docker
#   → push lên registry localhost:5000 → k3s kéo về (cấu hình ở /etc/rancher/k3s/registries.yaml).
# =============================================================================
name: datn-platform

services:

  jenkins:
    build:
      context: .
      dockerfile: jenkins.Dockerfile
      args:
        INSTALL_KUBECTL: "true"
    image: datn/jenkins:lts-k8s
    container_name: jenkins
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID:?thieu DOCKER_GID trong .env}"
    environment:
      JAVA_OPTS: "-Xmx1g -Djava.awt.headless=true"
      MAVEN_OPTS: "-Xmx1g"
    ports:
      # Traefik (trong k3s) gọi tới qua private IP của EC2. Security Group KHÔNG mở 8080 ra Internet.
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/datn:/opt/datn            # state/deployed.env + history để rollback
    mem_limit: 3g

  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"          # chỉ trong máy: Docker push & k3s pull đều qua localhost
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry_data:/var/lib/registry
    mem_limit: 128m

volumes:
  jenkins_home:
  registry_data:
