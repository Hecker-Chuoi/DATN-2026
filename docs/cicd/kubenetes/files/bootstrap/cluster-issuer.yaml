# =============================================================================
# ClusterIssuer – "nơi cấp chứng chỉ" cho cert-manager (áp dụng 1 lần, sau khi cài cert-manager)
#   kubectl apply -f cluster-issuer.yaml
# Thử nghiệm nhiều lần thì đổi server sang staging để không dính rate-limit của Let's Encrypt:
#   https://acme-staging-v02.api.letsencrypt.org/directory
# =============================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ban@example.com                     # ĐỔI: email nhận cảnh báo hết hạn chứng chỉ
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
