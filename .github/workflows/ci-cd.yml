# CI/CD DATN-2026: GitHub Actions -> Docker Hub -> SSH sang server ứng dụng -> docker compose.
# Hướng dẫn: docs/cicd/cac_buoc/06_GITHUB_ACTIONS_CICD.md
#
# - Pull request: chỉ chạy test + build frontend (không đụng tới secret, không deploy).
# - Push vào main: test -> build + push 7 image (tag = git SHA 7 ký tự) -> deploy -> kiểm tra qua HTTPS.
# - Chạy tay (Actions > CI/CD > Run workflow): tick "deploy" để build + deploy một nhánh khác main (vd để thử).
#
# Secret cần tạo (Settings > Secrets and variables > Actions): DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, DEPLOY_SSH_KEY,
# DEPLOY_HOST (hoặc Variable cùng tên); tuỳ chọn DEPLOY_KNOWN_HOSTS.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Build, push và deploy nhánh đang chọn lên server (mặc định chỉ chạy test)"
        type: boolean
        default: false

# PR mới đẩy lên thì huỷ lượt chạy cũ của chính PR đó; lượt chạy trên main thì KHÔNG huỷ (đang deploy dở)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Bỏ các *ApplicationTests (@SpringBootTest contextLoads): chúng cần Postgres / Keycloak thật.
      # Còn lại là unit test thuần (549 test: work 344, workspace 48, notification 148, ai-service 9; xanh với JDK 21).
      - name: mvn verify
        working-directory: backend
        run: mvn -B -ntp verify '-Dtest=!*ApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false
      - name: Báo cáo test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Lint + build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      # Lint hiện có ~190 lỗi sẵn trong code (chưa dọn): chạy nhưng KHÔNG chặn. Dọn xong thì bỏ continue-on-error.
      - name: npm run lint
        working-directory: frontend
        continue-on-error: true
        run: npm run lint
      - name: npm run build
        working-directory: frontend
        run: npm run build

  deploy:
    name: Build, push và deploy
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production          # tạo sẵn ở Settings > Environments nếu muốn bắt duyệt tay trước khi deploy
    concurrency:
      group: production-deploy       # không bao giờ hai lượt deploy chạy chồng nhau
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra secret
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          miss=0
          [ -n "$DH_USER" ]       || { echo "::error::Thiếu secret DOCKERHUB_USERNAME"; miss=1; }
          [ -n "$DH_TOKEN" ]      || { echo "::error::Thiếu secret DOCKERHUB_TOKEN"; miss=1; }
          [ -n "$SSH_KEY" ]       || { echo "::error::Thiếu secret DEPLOY_SSH_KEY"; miss=1; }
          [ -n "$DEPLOY_HOST" ]   || { echo "::error::Thiếu secret / variable DEPLOY_HOST (IP public của server ứng dụng)"; miss=1; }
          [ "$miss" = 0 ] || exit 1
          # Bỏ khoảng trắng / xuống dòng dán thừa vào DEPLOY_HOST (hay gặp khi copy từ trình duyệt)
          echo "DEPLOY_HOST=$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Tag = git SHA 7 ký tự
        run: echo "TAG=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Cấu hình SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "::error::DEPLOY_SSH_KEY không phải khoá riêng hợp lệ (thiếu dòng BEGIN/END hoặc dán sai)"; exit 1; }
          if [ -n "$KNOWN_HOSTS" ]; then
            # Chỉ lấy "<kiểu khoá> <khoá>" của từng dòng rồi gắn đúng DEPLOY_HOST: không phụ thuộc secret ghi IP hay tên máy
            printf '%s\n' "$KNOWN_HOSTS" | awk -v h="$DEPLOY_HOST" '!/^#/ && NF>=3 {print h, $(NF-1), $NF}' > ~/.ssh/known_hosts
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::warning::DEPLOY_KNOWN_HOSTS trống hoặc không đọc được: tin dấu vân tay lấy lúc chạy (kém an toàn hơn)"
            ssh-keyscan -T 15 "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi

      # Thử SSH NGAY (trước khi mất 15–25 phút build): sai khoá / sai IP / cổng 22 chưa mở thì dừng sớm và in lý do
      - name: Kiểm tra kết nối SSH
        run: |
          SSH_OPTS=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes)
          if ! ssh "${SSH_OPTS[@]}" "deployer@$DEPLOY_HOST" check; then
            echo "::error::Không SSH được vào deployer@$DEPLOY_HOST (xem docs/cicd/cac_buoc/06 §10). Chi tiết:"
            ssh -v "${SSH_OPTS[@]}" "deployer@$DEPLOY_HOST" check 2>&1 | grep -E "debug1: (Connecting|Connection|Host key|Server host key|Offering|Authentications|Trying|No more|Authenticated)|Permission denied|Host key verification|Connection (timed out|refused|closed|reset)|known_hosts" | tail -20
            exit 1
          fi

      - name: Đăng nhập Docker Hub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin

      # build-push.sh đọc REGISTRY và SSO_HOST từ infrastructure/prod/public.env (frontend nhúng URL Keycloak lúc build)
      - name: Build + push 7 image
        run: bash infrastructure/ci/build-push.sh "$TAG"

      # Khoá SSH trên server bị khoá chặt bằng command="/home/deployer/deploy.sh": chỉ chạy được deploy | rollback | check.
      # deploy.sh giải nén gói, pull, up -d --wait, smoke test; lỗi thì tự về bản trước và thoát mã khác 0 (job đỏ).
      - name: Deploy
        run: |
          tar cz -C infrastructure docker-compose.prod.yml prod keycloak \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 "deployer@$DEPLOY_HOST" "deploy $TAG"

      - name: Kiểm tra công khai qua HTTPS
        run: |
          APP_HOST=$(sed -n 's/^APP_HOST=//p' infrastructure/prod/public.env | head -1)
          for _ in $(seq 1 12); do
            if curl -fsS -o /dev/null --max-time 15 "https://$APP_HOST/identity/actuator/health"; then echo "OK https://$APP_HOST"; exit 0; fi
            sleep 10
          done
          echo "::error::https://$APP_HOST không phản hồi sau deploy"; exit 1

      - name: Đăng xuất Docker Hub
        if: always()
        run: docker logout || true
