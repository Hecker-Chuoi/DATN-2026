server:
  port: 8083

spring:
  application:
    name: work-service

  # ─── PostgreSQL (datn_main_db) ───────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5433/datn_main_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_work_schema_history
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ─── OAuth2 Resource Server (Keycloak Token Validation) ──
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8088/realms/datn-realm/protocol/openid-connect/certs
          issuer-uri: http://localhost:8088/realms/datn-realm

  # ─── Redis Caching & Ephemeral State ───
  data:
    redis:
      host: localhost
      port: 6380
      timeout: 2000ms

  # ─── Apache Kafka Producer ───
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all

# ─── MinIO Object Storage (Attachments) ───
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadminpassword}
  bucket-name: ${MINIO_BUCKET_NAME:work-attachments}

# ─── Microservices Internal Endpoints ───
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  services:
    identity:
      url: http://localhost:8082
    workspace:
      url: http://localhost:8087
    notification:
      url: ${APP_SERVICES_NOTIFICATION_URL:http://localhost:9994}

# ─── GitHub OAuth & Integration Configuration ───
github:
  client-id: ${GITHUB_CLIENT_ID:Ov23ctW7dA1RgqhNY4Fo}
  client-secret: ${GITHUB_CLIENT_SECRET:d55e5cba3c223ab07f8f7fdb85cb18f2be127eb0}
  redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:5173/integrations/github/callback}
  api-url: https://api.github.com
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:datn-github-webhook-secret-2026}

logging:
  level:
    root: INFO
    com.datn.workservice: DEBUG
    org.hibernate.SQL: DEBUG

