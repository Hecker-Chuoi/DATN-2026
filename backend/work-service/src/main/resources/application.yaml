server:
  port: 8083

spring:
  application:
    name: work-service
  # Đọc secret GitHub từ .env (gitignored) khi chạy IntelliJ ở bất kỳ working dir nào
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./work-service/.env[.properties]
      - optional:file:./backend/work-service/.env[.properties]

  # ─── PostgreSQL (datn_main_db) ───────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5433/datn_main_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_work_schema_history
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ─── OAuth2 Resource Server (Keycloak Token Validation) ──
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8088/realms/datn-realm/protocol/openid-connect/certs
          issuer-uri: http://localhost:8088/realms/datn-realm

  # ─── Redis Caching & Ephemeral State ───
  data:
    redis:
      host: localhost
      port: 6380
      timeout: 2000ms

  # ─── Apache Kafka Producer ───
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all

# ─── MinIO Object Storage (Attachments) ───
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadminpassword}
  bucket-name: ${MINIO_BUCKET_NAME:work-attachments}

# ─── Microservices Internal Endpoints ───
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  public-url: ${APP_PUBLIC_URL:http://localhost:8081}        # URL gateway nhìn từ internet (ngrok khi dev) để GitHub gọi webhook
  github:                                                   # OAuth App: GitHub > Settings > Developer settings > OAuth Apps
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:change-me}
    token-enc-key: ${GITHUB_TOKEN_ENC_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}   # 32 byte 0, chỉ dev; openssl rand -base64 32
  services:
    identity:
      url: http://localhost:8082
    workspace:
      url: http://localhost:8087
    notification:
      url: ${APP_SERVICES_NOTIFICATION_URL:http://localhost:9994}

logging:
  level:
    root: INFO
    com.datn.workservice: DEBUG
    org.hibernate.SQL: DEBUG
