# Profile cá nhân (tránh trùng cổng 808x trên máy): chạy với -Dspring.profiles.active=tuananh
server:
  port: 9991

spring:
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: http://localhost:9992
          predicates:
            - Path=/identity/api/**,/identity/actuator/**
          filters:
            - StripPrefix=1
        - id: work-service
          uri: http://localhost:9993
          predicates:
            - Path=/work/api/**,/work/actuator/**,/work/ws-work/**
          filters:
            - StripPrefix=1
        - id: workspace-service
          uri: http://localhost:9997
          predicates:
            - Path=/workspace/api/**,/workspace/actuator/**
          filters:
            - StripPrefix=1
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9998/realms/datn-realm/protocol/openid-connect/certs
          issuer-uri: http://localhost:9998/realms/datn-realm
