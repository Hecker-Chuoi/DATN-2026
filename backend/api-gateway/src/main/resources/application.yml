server:
  port: 8081

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: http://localhost:8082
          predicates:
            - Path=/identity/api/**, /identity/actuator/**
          filters:
            - StripPrefix=1

        - id: work-service
          uri: http://localhost:8083
          predicates:
            - Path=/work/api/**, /work/actuator/**, /work/ws-work/**
          filters:
            - StripPrefix=1

        # Predicate CO Y khong cover /workspace/internal/**: nhom internal cua
        # workspace-service khong xac thuc, chi danh cho service-to-service.
        - id: workspace-service
          uri: http://localhost:8087
          predicates:
            - Path=/workspace/api/**, /workspace/actuator/**
          filters:
            - StripPrefix=1
        # Thông báo: REST /notification/api/** (JWT) + WebSocket /notification/ws (xác thực ở frame STOMP CONNECT).
        # CỐ Ý không route /notification/internal/**: endpoint gửi email nội bộ, không xác thực.
        - id: notification-service
          uri: http://localhost:9994
          predicates:
            - Path=/notification/api/**, /notification/ws/**
          filters:
            - StripPrefix=1

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowed-headers:
              - "*"
            exposed-headers:
              - "X-Correlation-Id"
            allow-credentials: true
            max-age: 3600

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8088/realms/datn-realm/protocol/openid-connect/certs
          issuer-uri: http://localhost:8088/realms/datn-realm
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
logging:
  level:
    root: INFO
    com.datn.api_gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
