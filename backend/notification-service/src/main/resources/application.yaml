server:
  port: 9994

spring:
  application:
    name: notification-service
  # Đọc biến MAIL_* từ file .env cạnh module (gitignored) khi chạy từ IntelliJ; Docker dùng infrastructure/.env
  config:
    import:
      - optional:file:./.env[.properties]                               # cwd = backend/notification-service
      - optional:file:./notification-service/.env[.properties]          # cwd = backend
      - optional:file:./backend/notification-service/.env[.properties]  # cwd = root repo (IntelliJ mặc định)
  # Mặc định trỏ tới Mailpit (docker-compose): SMTP localhost:1025, xem mail tại http://localhost:8025
  # Với SMTP thật (Gmail...): MAIL_HOST=smtp.gmail.com MAIL_PORT=587 MAIL_USERNAME=... MAIL_PASSWORD=<app password> MAIL_SMTP_AUTH=true MAIL_SMTP_STARTTLS=true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  # Bảng notifications nằm chung DB datn_main_db, Flyway riêng (giống workspace-service)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/datn_main_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_notification_schema_history
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8088/realms/datn-realm/protocol/openid-connect/certs}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8088/realms/datn-realm}

  # Nhận sự kiện từ work-service / workspace-service (Transactional Outbox → Kafka)
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # Chỉ dùng để chuyển sự kiện lỗi sang notification-events.DLT
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  mail:
    from: ${MAIL_FROM:DATN-2026 <no-reply@datn.local>}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  services:
    identity:
      url: ${APP_SERVICES_IDENTITY_URL:http://localhost:8082}
  notifications:
    # Gộp thông báo chưa đọc cùng group_key trong khoảng này (quy tắc R4)
    group-window-minutes: 10
    # Dọn hẳn thông báo đã xoá mềm / đã đọc quá lâu
    purge-deleted-after-days: 30
    purge-read-after-days: 90
    # Tắt để chạy không cần Kafka (chỉ dùng REST + WebSocket)
    kafka-enabled: ${APP_NOTIFICATIONS_KAFKA_ENABLED:true}

logging:
  level:
    com.datn.notification: DEBUG
