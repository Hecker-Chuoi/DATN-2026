server:
  port: 9994

spring:
  application:
    name: notification-service
  # Mặc định trỏ tới Mailpit (docker-compose): SMTP localhost:1025, xem mail tại http://localhost:8025
  # Với SMTP thật (Gmail...): MAIL_HOST=smtp.gmail.com MAIL_PORT=587 MAIL_USERNAME=... MAIL_PASSWORD=<app password> MAIL_SMTP_AUTH=true MAIL_SMTP_STARTTLS=true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  mail:
    from: ${MAIL_FROM:DATN-2026 <no-reply@datn.local>}
