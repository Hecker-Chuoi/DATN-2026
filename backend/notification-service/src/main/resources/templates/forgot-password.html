<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu</title>
</head>
<body style="margin: 0; padding: 40px 0; background-color: #f4f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">

<!-- Khung bao ngoài căn giữa -->
<table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0">
    <tr>
        <td align="center">

            <!-- Container chính -->
            <table role="presentation" width="560" border="0" cellspacing="0" cellpadding="0" style="max-width: 560px; width: 100%; background-color: #ffffff; border: 1px solid #e2e5e8; box-shadow: 0 2px 6px rgba(0,0,0,0.04);">

                <!-- Thanh dải màu trên cùng -->
                <tr>
                    <td height="8" style="font-size: 0; line-height: 0; background: linear-gradient(90deg, #1ab7ea 0%, #00d3b6 14%, #7ac143 28%, #f8b334 42%, #f26522 57%, #ed1b24 71%, #9e1f63 85%, #1a75bb 100%);">
                        &nbsp;
                    </td>
                </tr>

                <!-- Phần nội dung bên trong -->
                <tr>
                    <td style="padding: 40px 48px 45px 48px;">

                        <!-- Logo Vimeo -->
<!--                        <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0">-->
<!--                            <tr>-->
<!--                                <td align="center" style="padding-bottom: 35px;">-->
<!--                                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Vimeo_Logo.svg/2560px-Vimeo_Logo.svg.png" alt="Vimeo" width="140" style="display: block; border: 0; outline: none; text-decoration: none;">-->
<!--                                </td>-->
<!--                            </tr>-->
<!--                        </table>-->


                        <h1 style="margin: 0 0 16px 0; font-size: 23px; line-height: 1.3; font-weight: 700; color: #34404b;">
                            Hi, {{recipient_name}}!
                        </h1>

                        <h2 style="margin: 0 0 16px 0; font-size: 17px; line-height: 1.4; font-weight: 600; color: #435363;">
                            There was a request to change your password.
                        </h2>

                        <p style="margin: 0 0 35px 0; font-size: 14px; line-height: 1.6; color: #536473;">
                            If you did not make this request, just ignore this email. Otherwise, please click the button below to change your password. This link expires in {{ttl_minutes}} minutes.
                        </p>

                        <!-- Nút bấm Change Password -->
                        <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0">
                            <tr>
                                <td align="center" style="padding-bottom: 45px;">
                                    <table role="presentation" border="0" cellspacing="0" cellpadding="0" style="width: 290px;">
                                        <tr>
                                            <td align="center" bgcolor="#2980b9" style="border-radius: 4px; background-color: #2e8bce;">
                                                <a href="{{link}}" target="_blank" style="display: block; padding: 14px 24px; font-size: 16px; font-weight: 700; color: #ffffff; text-decoration: none; border-radius: 4px; letter-spacing: 0.2px;">
                                                    Change Password
                                                </a>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>

                        <!-- Chữ ký cuối mail -->
                        <p style="margin: 0; font-size: 14px; line-height: 1.5; font-style: italic; color: #556677;">
                            LOVE,<br>
                            DATN
                        </p>

                    </td>
                </tr>
            </table>

        </td>
    </tr>
</table>

</body>
</html>
